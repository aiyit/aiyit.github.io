<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050">
<defs><linearGradient id="b" x2="1"><stop stop-color="#063875"/><stop offset="1" stop-color="#1472c8"/></linearGradient><linearGradient id="g" x2="1"><stop stop-color="#087b39"/><stop offset="1" stop-color="#19aa60"/></linearGradient><linearGradient id="p" x2="1"><stop stop-color="#51209b"/><stop offset="1" stop-color="#8b42ce"/></linearGradient></defs>
<rect width="1200" height="1050" rx="24" fill="#f4f8ff"/>
<rect x="15" y="12" width="1170" height="75" rx="18" fill="url(#b)"/><text x="600" y="62" font-family="Arial,sans-serif" font-size="43" font-weight="bold" fill="#fff" text-anchor="middle">JavaScript Date 객체 · setTimeout() · Array 메소드</text>
<!-- Date -->
<rect x="20" y="105" width="1160" height="300" rx="18" fill="#fff" stroke="#5799e5" stroke-width="3"/><rect x="20" y="105" width="1160" height="52" rx="16" fill="url(#b)"/><text x="600" y="141" font-family="Arial" font-size="30" font-weight="bold" fill="#fff" text-anchor="middle">1. Date 객체 — 날짜와 시간을 다루는 객체</text>
<g font-family="Arial" fill="#17395f"><text x="55" y="205" font-size="24" font-weight="bold">객체 생성</text><rect x="45" y="220" width="330" height="65" rx="12" fill="#e7f2ff" stroke="#86b8f1" stroke-width="2"/><text x="65" y="260" font-size="22" font-weight="bold">const now = new Date();</text><text x="55" y="330" font-size="20">현재 시스템의 날짜와 시간</text><text x="55" y="365" font-size="20" fill="#1769c2">예: 2026-11-04 14:30:25</text>
<text x="420" y="205" font-size="24" font-weight="bold">주요 메소드</text>
<rect x="405" y="220" width="385" height="23" rx="5" fill="#e5f0ff"/><text x="415" y="238" font-size="16" font-weight="bold">getFullYear()</text><text x="650" y="238" font-size="15">연도 반환</text><rect x="405" y="244" width="385" height="23" rx="5" fill="#f1f6ff"/><text x="415" y="262" font-size="16" font-weight="bold">getMonth()</text><text x="650" y="262" font-size="15">월 반환 (0~11)</text><rect x="405" y="268" width="385" height="23" rx="5" fill="#e5f0ff"/><text x="415" y="286" font-size="16" font-weight="bold">getDate()</text><text x="650" y="286" font-size="15">일 반환 (1~31)</text><rect x="405" y="292" width="385" height="23" rx="5" fill="#f1f6ff"/><text x="415" y="310" font-size="16" font-weight="bold">getDay()</text><text x="650" y="310" font-size="15">요일 반환 (0~6)</text><rect x="405" y="316" width="385" height="23" rx="5" fill="#e5f0ff"/><text x="415" y="334" font-size="16" font-weight="bold">getHours() / getMinutes()</text><text x="650" y="334" font-size="15">시 / 분 반환</text><rect x="405" y="340" width="385" height="23" rx="5" fill="#f1f6ff"/><text x="415" y="358" font-size="16" font-weight="bold">getSeconds()</text><text x="650" y="358" font-size="15">초 반환</text><rect x="405" y="364" width="385" height="23" rx="5" fill="#e5f0ff"/><text x="415" y="382" font-size="16" font-weight="bold">toLocaleString()</text><text x="650" y="382" font-size="15">지역 형식의 날짜 문자열</text>
<text x="835" y="205" font-size="24" font-weight="bold">실행 예제</text><rect x="820" y="220" width="330" height="145" rx="12" fill="#f2f7ff" stroke="#a8c9f2" stroke-width="2"/><text x="840" y="252" font-size="18">const d = new Date();</text><text x="840" y="282" font-size="18">d.getFullYear();</text><text x="840" y="312" font-size="18">d.toLocaleString();</text><text x="840" y="348" font-size="16" fill="#1769c2">월은 0부터 시작합니다!</text></g>
<!-- timeout -->
<rect x="20" y="425" width="1160" height="255" rx="18" fill="#fff" stroke="#48a66b" stroke-width="3"/><rect x="20" y="425" width="1160" height="52" rx="16" fill="url(#g)"/><text x="600" y="461" font-family="Arial" font-size="30" font-weight="bold" fill="#fff" text-anchor="middle">2. setTimeout() — 일정 시간 후 함수를 한 번 실행</text>
<g font-family="Arial" fill="#17452c"><text x="55" y="530" font-size="24" font-weight="bold">기본 형식</text><rect x="45" y="545" width="345" height="66" rx="12" fill="#e7f8ed" stroke="#8bd2a4" stroke-width="2"/><text x="65" y="586" font-size="22" font-weight="bold">setTimeout(함수, 시간);</text><text x="55" y="645" font-size="18">시간 단위: 밀리초(ms)</text><text x="435" y="530" font-size="24" font-weight="bold">사용 예제</text><rect x="420" y="545" width="410" height="95" rx="12" fill="#f1fbf4" stroke="#a5dcb6" stroke-width="2"/><text x="440" y="575" font-size="18">setTimeout(() =&gt; {</text><text x="460" y="605" font-size="18">alert("3초 후 실행!");</text><text x="440" y="630" font-size="18">}, 3000);</text><text x="875" y="530" font-size="24" font-weight="bold">실행 흐름</text><rect x="860" y="550" width="105" height="75" rx="12" fill="#d9edff" stroke="#559ee5" stroke-width="2"/><text x="912" y="595" font-size="20" text-anchor="middle">호출</text><path d="M970 588h45m-12 -10 12 10 -12 10" stroke="#2683d9" stroke-width="5" fill="none"/><rect x="1020" y="550" width="125" height="75" rx="12" fill="#fff0c8" stroke="#e8b443" stroke-width="2"/><text x="1082" y="580" font-size="19" text-anchor="middle">3초 대기</text><text x="1082" y="605" font-size="16" text-anchor="middle">함수 실행</text></g>
<!-- Array -->
<rect x="20" y="700" width="1160" height="330" rx="18" fill="#fff" stroke="#9c75d2" stroke-width="3"/><rect x="20" y="700" width="1160" height="52" rx="16" fill="url(#p)"/><text x="600" y="736" font-family="Arial" font-size="30" font-weight="bold" fill="#fff" text-anchor="middle">3. Array 메소드 — 여러 데이터를 순서대로 저장하고 처리</text>
<g font-family="Arial" fill="#322052"><text x="55" y="800" font-size="24" font-weight="bold">배열이란?</text><text x="55" y="835" font-size="19">여러 값을 하나의 변수에</text><text x="55" y="862" font-size="19">순서대로 저장합니다.</text><g><rect x="55" y="885" width="55" height="55" rx="8" fill="#f5c5e9" stroke="#7951b5" stroke-width="2"/><text x="82" y="921" font-size="25" font-weight="bold" text-anchor="middle">1</text><rect x="120" y="885" width="55" height="55" rx="8" fill="#ffe09a" stroke="#7951b5" stroke-width="2"/><text x="147" y="921" font-size="25" font-weight="bold" text-anchor="middle">2</text><rect x="185" y="885" width="55" height="55" rx="8" fill="#bde4ff" stroke="#7951b5" stroke-width="2"/><text x="212" y="921" font-size="25" font-weight="bold" text-anchor="middle">3</text><rect x="250" y="885" width="55" height="55" rx="8" fill="#c9f0c6" stroke="#7951b5" stroke-width="2"/><text x="277" y="921" font-size="25" font-weight="bold" text-anchor="middle">4</text></g><text x="55" y="980" font-size="17">인덱스: 0, 1, 2, 3</text>
<text x="370" y="800" font-size="24" font-weight="bold">자주 사용하는 메소드</text>
<rect x="350" y="815" width="800" height="24" rx="5" fill="#eee6fb"/><text x="365" y="833" font-size="16" font-weight="bold">push(value)</text><text x="555" y="833" font-size="15">마지막에 추가</text><text x="760" y="833" font-size="15" fill="#315a9b">[1,2,3] → [1,2,3,4]</text><rect x="350" y="840" width="800" height="24" rx="5" fill="#f8f3ff"/><text x="365" y="858" font-size="16" font-weight="bold">pop()</text><text x="555" y="858" font-size="15">마지막 요소 제거</text><text x="760" y="858" font-size="15" fill="#315a9b">[1,2,3] → [1,2]</text><rect x="350" y="865" width="800" height="24" rx="5" fill="#eee6fb"/><text x="365" y="883" font-size="16" font-weight="bold">unshift(value)</text><text x="555" y="883" font-size="15">처음에 추가</text><text x="760" y="883" font-size="15" fill="#315a9b">[1,2] → [0,1,2]</text><rect x="350" y="890" width="800" height="24" rx="5" fill="#f8f3ff"/><text x="365" y="908" font-size="16" font-weight="bold">shift()</text><text x="555" y="908" font-size="15">첫 요소 제거</text><text x="760" y="908" font-size="15" fill="#315a9b">[1,2,3] → [2,3]</text><rect x="350" y="915" width="800" height="24" rx="5" fill="#eee6fb"/><text x="365" y="933" font-size="16" font-weight="bold">map(fn)</text><text x="555" y="933" font-size="15">각 요소를 변환</text><text x="760" y="933" font-size="15" fill="#315a9b">[1,2,3] → [2,4,6]</text><rect x="350" y="940" width="800" height="24" rx="5" fill="#f8f3ff"/><text x="365" y="958" font-size="16" font-weight="bold">filter(fn)</text><text x="555" y="958" font-size="15">조건에 맞는 요소 선택</text><text x="760" y="958" font-size="15" fill="#315a9b">[1,2,3,4] → [2,4]</text><rect x="350" y="965" width="800" height="24" rx="5" fill="#eee6fb"/><text x="365" y="983" font-size="16" font-weight="bold">forEach(fn)</text><text x="555" y="983" font-size="15">각 요소 반복 실행</text><text x="760" y="983" font-size="15" fill="#315a9b">요소마다 함수 실행</text><rect x="350" y="990" width="800" height="24" rx="5" fill="#f8f3ff"/><text x="365" y="1008" font-size="16" font-weight="bold">slice() / splice()</text><text x="555" y="1008" font-size="15">일부 추출 / 추가·삭제</text><text x="760" y="1008" font-size="15" fill="#315a9b">원본 변경 여부가 다름</text></g>
</svg>