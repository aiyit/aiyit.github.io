label('웨이퍼 단면 (확대 개념도)',0,3.3,0,xs,.95);label('SiO₂ 산화막',-2.7,1.3,.3,xs,.6);label('Si 기판',-2.7,.4,.3,xs,.6);label('원래 표면(점선)',2.7,1,.3,xs,.6);

 {n:'웨이퍼 로딩',d:5,t:g=>'세정된 실리콘 웨이퍼를 석영 보트에 꽂아 로딩 스테이션에서 산화로 안으로 천천히 밀어 넣습니다. 열충격과 오염을 막기 위해 저속으로 진입합니다.',e:'보트 이송 : 스테이션 → 튜브 중앙'},
