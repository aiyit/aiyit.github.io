<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#e8f1ff"/></linearGradient><linearGradient id="navy" x2="1"><stop stop-color="#073b78"/><stop offset="1" stop-color="#1264b5"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#31577d" flood-opacity=".18"/></filter></defs>
<rect width="1200" height="820" rx="24" fill="url(#bg)"/>
<rect x="18" y="18" width="1164" height="78" rx="18" fill="url(#navy)"/>
<text x="600" y="68" font-family="Arial,sans-serif" font-size="38" font-weight="bold" text-anchor="middle" fill="#fff">DOM이란? HTML을 브라우저가 만든 객체 트리</text>
<g font-family="Arial,sans-serif" font-weight="bold" text-anchor="middle">
<rect x="35" y="125" width="245" height="76" rx="15" fill="#fff" stroke="#76a7e8" stroke-width="3" filter="url(#shadow)"/><text x="157" y="171" font-size="24" fill="#123b69">HTML 코드</text><path d="M285 163h35m-12 -12 12 12 -12 12" fill="none" stroke="#1673e8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="330" y="125" width="245" height="76" rx="15" fill="#fff" stroke="#76a7e8" stroke-width="3" filter="url(#shadow)"/><text x="452" y="171" font-size="24" fill="#123b69">브라우저 파싱</text><path d="M580 163h35m-12 -12 12 12 -12 12" fill="none" stroke="#1673e8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="625" y="125" width="245" height="76" rx="15" fill="#fff" stroke="#76a7e8" stroke-width="3" filter="url(#shadow)"/><text x="747" y="171" font-size="24" fill="#123b69">DOM 트리 생성</text><path d="M875 163h35m-12 -12 12 12 -12 12" fill="none" stroke="#1673e8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="920" y="125" width="245" height="76" rx="15" fill="#fff" stroke="#76a7e8" stroke-width="3" filter="url(#shadow)"/><text x="1042" y="171" font-size="24" fill="#123b69">JavaScript로 화면 변경</text>
</g>
<rect x="25" y="230" width="720" height="430" rx="18" fill="#fff" stroke="#8bb4e8" stroke-width="3"/>
<rect x="25" y="230" width="720" height="48" rx="16" fill="url(#navy)"/><text x="385" y="263" font-family="Arial" font-size="25" font-weight="bold" fill="#fff" text-anchor="middle">DOM 트리 구조 (부모와 자식 관계)</text>
<g stroke="#47739e" stroke-width="3" fill="none"><path d="M385 330V360 M385 395V420H210V450 M385 420H560V450 M210 485V510H120V535 M210 510H300V535 M560 485V510H470V535 M560 510H650V535"/></g>
<g font-family="Arial,sans-serif" font-size="23" font-weight="bold" text-anchor="middle">
<rect x="285" y="295" width="200" height="45" rx="12" fill="#e8d9ff" stroke="#8c50e8" stroke-width="3"/><text x="385" y="326" fill="#35205b">document</text>
<rect x="310" y="360" width="150" height="45" rx="12" fill="#cfeaff" stroke="#1686e8" stroke-width="3"/><text x="385" y="391" fill="#123b69">html</text>
<rect x="125" y="450" width="170" height="45" rx="12" fill="#cfeaff" stroke="#1686e8" stroke-width="3"/><text x="210" y="481" fill="#123b69">head</text>
<rect x="475" y="450" width="170" height="45" rx="12" fill="#cfeaff" stroke="#1686e8" stroke-width="3"/><text x="560" y="481" fill="#123b69">body</text>
<rect x="55" y="535" width="130" height="48" rx="12" fill="#e3f7c9" stroke="#78c52b" stroke-width="3"/><text x="120" y="567" fill="#294b12">title</text>
<rect x="220" y="535" width="160" height="48" rx="12" fill="#d9f2ff" stroke="#1686e8" stroke-width="3"/><text x="300" y="567" fill="#123b69">h1 / p</text>
<rect x="405" y="535" width="130" height="48" rx="12" fill="#e3f7c9" stroke="#78c52b" stroke-width="3"/><text x="470" y="567" fill="#294b12">h1</text>
<rect x="565" y="535" width="170" height="48" rx="12" fill="#ffe8c5" stroke="#ed9b20" stroke-width="3"/><text x="650" y="567" fill="#69410c">button</text>
</g>
<text x="385" y="625" font-family="Arial" font-size="18" fill="#4a5e72" text-anchor="middle">각 태그와 텍스트가 노드(Node) 객체로 연결됩니다.</text>
<rect x="770" y="230" width="405" height="430" rx="18" fill="#fff" stroke="#8bb4e8" stroke-width="3"/>
<rect x="770" y="230" width="405" height="48" rx="16" fill="url(#navy)"/><text x="972" y="263" font-family="Arial" font-size="25" font-weight="bold" fill="#fff" text-anchor="middle">JavaScript 요소 찾기</text>
<g font-family="Arial,sans-serif">
<circle cx="815" cy="330" r="22" fill="#1673e8"/><text x="815" y="338" font-size="22" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
<text x="850" y="324" font-size="19" font-weight="bold" fill="#153c68">ID로 하나 찾기</text><text x="850" y="354" font-size="17" fill="#263b50">getElementById("txt")</text>
<circle cx="815" cy="430" r="22" fill="#1673e8"/><text x="815" y="438" font-size="22" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
<text x="850" y="424" font-size="19" font-weight="bold" fill="#153c68">태그 이름으로 찾기</text><text x="850" y="454" font-size="16" fill="#263b50">getElementsByTagName("h1")[0]</text>
<circle cx="815" cy="530" r="22" fill="#1673e8"/><text x="815" y="538" font-size="22" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
<text x="850" y="524" font-size="19" font-weight="bold" fill="#153c68">클래스 이름으로 찾기</text><text x="850" y="554" font-size="16" fill="#263b50">getElementsByClassName("cls")[0]</text>
</g>
<rect x="25" y="685" width="1150" height="105" rx="18" fill="url(#navy)"/>
<text x="600" y="727" font-family="Arial" font-size="25" font-weight="bold" fill="#ffe45c" text-anchor="middle">핵심 정리</text>
<text x="600" y="766" font-family="Arial" font-size="22" font-weight="bold" fill="#fff" text-anchor="middle">HTML = 구조   |   DOM = 객체 트리   |   JavaScript = DOM을 조작해 화면 변경</text>
</svg>