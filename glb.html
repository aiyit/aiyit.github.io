<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101726"><title>GLB 3D 뷰어</title>
<style>
*{box-sizing:border-box}html,body,#view{margin:0;width:100%;height:100%;overflow:hidden}body{background:#101726;color:#edf3fc;font:14px system-ui,'Noto Sans KR',sans-serif}#view{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 42%,#263750,#101726 75%)}canvas{display:block;width:100%;height:100%;touch-action:none}.top{position:fixed;top:12px;left:12px;right:12px;z-index:2;display:flex;justify-content:space-between;align-items:center;pointer-events:none}.brand,.actions,.toolbar,#status{pointer-events:auto;background:#101726df;border:1px solid #ffffff25;border-radius:12px;padding:10px 13px;backdrop-filter:blur(10px)}h1{font-size:16px;margin:0 0 3px}.brand p{font-size:12px;color:#a9b7cd;margin:0}button,.filelabel{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:8px 11px;border:1px solid #31415b;border-radius:9px;background:#1c2a40;color:#edf3fc;font:600 12px system-ui;cursor:pointer}.toolbar{position:fixed;z-index:2;bottom:14px;left:50%;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:7px;max-width:calc(100vw - 20px)}#status{position:fixed;z-index:2;bottom:85px;left:12px;color:#a9b7cd;font-size:12px;max-width:calc(100vw - 24px)}input{display:none}@media(max-width:600px){.toolbar{bottom:8px;gap:5px;padding:7px}.toolbar button,.filelabel{min-height:35px;padding:7px;font-size:11px}h1{font-size:14px}}
</style></head><body>
<div id="view"></div><header class="top"><div class="brand"><h1>GLB 3D 뷰어</h1><p id="modelName">GLB 모델을 불러오는 중</p></div><div class="actions"><button id="help">도움말</button></div></header>
<div id="status">모델을 불러오는 중…</div><nav class="toolbar"><button id="reset">화면 초기화</button><button id="rotate">자동 회전 켜기</button><button id="wire">와이어프레임</button><button id="gridBtn">바닥 격자 끄기</button><button id="full">전체 화면</button><label class="filelabel" for="file">GLB 파일 열기</label><input id="file" type="file" accept=".glb,model/gltf-binary"></nav>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';
import {GLTFLoader} from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
const host=document.querySelector('#view'),status=document.querySelector('#status'),nameEl=document.querySelector('#modelName');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x111a29);
const camera=new THREE.PerspectiveCamera(40,1,.001,10000);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x617089,2));const key=new THREE.DirectionalLight(0xffe6c8,3);key.position.set(5,9,6);scene.add(key);const fill=new THREE.DirectionalLight(0xc4ddff,1.4);fill.position.set(-5,4,-4);scene.add(fill);
const grid=new THREE.GridHelper(20,40,0x60748e,0x34445c);scene.add(grid);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.07;controls.screenSpacePanning=true;
const loader=new GLTFLoader();let root=null,initialCamera=null,auto=false,wire=false;
function fit(obj){obj.updateMatrixWorld(true);const box=new THREE.Box3().setFromObject(obj);if(box.isEmpty())throw Error('표시할 3D 객체가 없습니다.');const size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3()),d=Math.max(size.x,size.y,size.z);obj.position.sub(center);obj.updateMatrixWorld(true);const dist=d/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov)/2))*1.65;camera.position.set(dist*.8,dist*.58,dist*1.2);camera.near=Math.max(d/10000,.0001);camera.far=Math.max(d*100,dist*10);camera.updateProjectionMatrix();controls.target.set(0,0,0);controls.minDistance=Math.max(d*.015,.001);controls.maxDistance=Math.max(d*30,1);controls.update();grid.position.y=-size.y/2+.005;grid.scale.setScalar(Math.max(1,d/10));initialCamera=camera.position.clone();}
function show(gltf,label){if(root)scene.remove(root);root=gltf.scene;root.traverse(n=>{if(n.isMesh){n.castShadow=true;n.receiveShadow=true;}});scene.add(root);fit(root);nameEl.textContent=label;status.textContent='모델 표시 완료 · 드래그하여 회전하고 휠/핀치로 확대하세요.';}
function loadURL(url,label){status.textContent='모델을 불러오는 중…';loader.load(url,g=>{try{show(g,label);}catch(e){status.textContent=e.message;}},e=>{if(e.total)status.textContent='다운로드 '+Math.round(e.loaded/e.total*100)+'%';},()=>{status.textContent='모델을 불러오지 못했습니다. GLB 파일 경로를 확인하거나 아래 버튼으로 파일을 선택하세요.';});}
document.querySelector('#file').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>loader.parse(reader.result,'',g=>show(g,f.name),()=>status.textContent='GLB 파일을 분석하지 못했습니다.');reader.readAsArrayBuffer(f);e.target.value='';});
document.querySelector('#reset').onclick=()=>{if(initialCamera){camera.position.copy(initialCamera);controls.target.set(0,0,0);controls.update();}};
document.querySelector('#rotate').onclick=e=>{auto=!auto;e.target.textContent=auto?'자동 회전 끄기':'자동 회전 켜기';};
document.querySelector('#wire').onclick=e=>{wire=!wire;if(root)root.traverse(n=>{if(n.isMesh)n.material.wireframe=wire;});e.target.textContent=wire?'재질 보기':'와이어프레임';};
document.querySelector('#gridBtn').onclick=e=>{grid.visible=!grid.visible;e.target.textContent=grid.visible?'바닥 격자 끄기':'바닥 격자 켜기';};
document.querySelector('#full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
document.querySelector('#help').onclick=()=>alert('마우스/한 손가락 드래그: 회전\n휠/두 손가락 핀치: 확대·축소\n오른쪽 드래그/두 손가락 이동: 화면 이동\nGLB 파일 열기 버튼으로 내 컴퓨터의 파일도 볼 수 있습니다.');
function resize(){const w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}new ResizeObserver(resize).observe(host);resize();
renderer.setAnimationLoop(()=>{controls.autoRotate=auto;controls.autoRotateSpeed=1.5;controls.update();renderer.render(scene,camera);});
const params=new URLSearchParams(location.search),requested=params.get('model')||'model.glb',safe=requested.split(/[\\/]/).pop();if(!safe.toLowerCase().endsWith('.glb'))status.textContent='model 값은 .glb 파일이어야 합니다.';else loadURL(new URL('./'+encodeURIComponent(safe),location.href).href,safe);
</script></body></html>
