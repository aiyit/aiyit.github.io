<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
<defs><linearGradient id="blue" x2="1"><stop stop-color="#06428f"/><stop offset="1" stop-color="#176bd0"/></linearGradient></defs>
<rect width="1200" height="900" rx="24" fill="#f7faff"/>
<text x="600" y="66" font-family="Arial,sans-serif" font-size="48" font-weight="bold" fill="#102e5c" text-anchor="middle">파이썬 파일 입출력 상세 설명</text>
<rect x="25" y="100" width="550" height="280" rx="18" fill="#fff" stroke="#9bb9d5" stroke-width="2"/>
<rect x="25" y="100" width="550" height="52" rx="14" fill="url(#blue)"/><text x="55" y="136" font-family="Arial" font-size="29" font-weight="bold" fill="#fff">① 파일 열기</text>
<text x="55" y="205" font-family="Arial" font-size="25" font-weight="bold" fill="#142d50">open(filename, mode, encoding='utf-8')</text>
<text x="55" y="250" font-family="Arial" font-size="22" fill="#173b66">→ 파일 객체(file object) 반환</text>
<text x="55" y="300" font-family="Arial" font-size="19" fill="#394b60">파일을 열고 읽기·쓰기 작업을 시작합니다.</text>
<text x="55" y="335" font-family="Arial" font-size="19" fill="#394b60">encoding은 문자 인코딩이며 UTF-8을 권장합니다.</text>
<rect x="600" y="100" width="575" height="280" rx="18" fill="#fff" stroke="#9bb9d5" stroke-width="2"/>
<rect x="600" y="100" width="575" height="52" rx="14" fill="url(#blue)"/><text x="630" y="136" font-family="Arial" font-size="29" font-weight="bold" fill="#fff">② 파일 모드 상세</text>
<g font-family="Arial" font-size="19" fill="#17324d">
<rect x="615" y="165" width="545" height="32" fill="#fff" stroke="#d3dfed"/><text x="635" y="188" font-weight="bold" fill="#06428f">r</text><text x="790" y="188">읽기 전용</text><text x="930" y="188" font-size="16">파일이 없으면 오류</text><rect x="615" y="199" width="545" height="32" fill="#f0f5fc" stroke="#d3dfed"/><text x="635" y="222" font-weight="bold" fill="#06428f">w</text><text x="790" y="222">쓰기</text><text x="930" y="222" font-size="16">기존 내용 삭제 후 생성</text><rect x="615" y="233" width="545" height="32" fill="#fff" stroke="#d3dfed"/><text x="635" y="256" font-weight="bold" fill="#06428f">a</text><text x="790" y="256">추가</text><text x="930" y="256" font-size="16">파일 끝에 이어 쓰기</text><rect x="615" y="267" width="545" height="32" fill="#f0f5fc" stroke="#d3dfed"/><text x="635" y="290" font-weight="bold" fill="#06428f">x</text><text x="790" y="290">배타적 생성</text><text x="930" y="290" font-size="16">이미 있으면 오류</text><rect x="615" y="301" width="545" height="32" fill="#fff" stroke="#d3dfed"/><text x="635" y="324" font-weight="bold" fill="#06428f">r+ / w+ / a+</text><text x="790" y="324">읽기와 쓰기</text><text x="930" y="324" font-size="16">모드별 파일 위치·초기화 차이</text><rect x="615" y="335" width="545" height="32" fill="#f0f5fc" stroke="#d3dfed"/><text x="635" y="358" font-weight="bold" fill="#06428f">b</text><text x="790" y="358">바이너리</text><text x="930" y="358" font-size="16">바이트 단위 처리 (rb, wb)</text>
</g>
<rect x="25" y="400" width="1150" height="185" rx="18" fill="#fff" stroke="#9bb9d5" stroke-width="2"/>
<rect x="25" y="400" width="1150" height="48" rx="14" fill="url(#blue)"/><text x="55" y="434" font-family="Arial" font-size="28" font-weight="bold" fill="#fff">③ 주요 파일 메소드</text>
<g font-family="Arial" text-anchor="middle" fill="#17324d">
<line x1="45" y1="465" x2="45" y2="565" stroke="#d0ddeb" stroke-width="2"/><text x="105" y="505" font-size="19" font-weight="bold">read(size)</text><text x="105" y="540" font-size="15">전체 또는 지정 크기 읽기</text><line x1="205" y1="465" x2="205" y2="565" stroke="#d0ddeb" stroke-width="2"/><text x="265" y="505" font-size="19" font-weight="bold">readline()</text><text x="265" y="540" font-size="15">한 줄 읽기</text><line x1="365" y1="465" x2="365" y2="565" stroke="#d0ddeb" stroke-width="2"/><text x="425" y="505" font-size="19" font-weight="bold">readlines()</text><text x="425" y="540" font-size="15">모든 줄을 리스트로</text><line x1="525" y1="465" x2="525" y2="565" stroke="#d0ddeb" stroke-width="2"/><text x="585" y="505" font-size="19" font-weight="bold">write(str)</text><text x="585" y="540" font-size="15">문자열 쓰기</text><line x1="685" y1="465" x2="685" y2="565" stroke="#d0ddeb" stroke-width="2"/><text x="745" y="505" font-size="19" font-weight="bold">writelines(list)</text><text x="745" y="540" font-size="15">문자열 목록 쓰기</text><line x1="845" y1="465" x2="845" y2="565" stroke="#d0ddeb" stroke-width="2"/><text x="905" y="505" font-size="19" font-weight="bold">seek() / tell()</text><text x="905" y="540" font-size="15">파일 위치 이동·확인</text><line x1="1005" y1="465" x2="1005" y2="565" stroke="#d0ddeb" stroke-width="2"/><text x="1065" y="505" font-size="19" font-weight="bold">close()</text><text x="1065" y="540" font-size="15">파일 닫기</text>
</g>
<rect x="25" y="605" width="550" height="265" rx="18" fill="#fff" stroke="#9bb9d5" stroke-width="2"/><rect x="25" y="605" width="550" height="48" rx="14" fill="#16804b"/><text x="55" y="639" font-family="Arial" font-size="27" font-weight="bold" fill="#fff">④ with 문을 권장하는 이유</text>
<text x="55" y="700" font-family="Arial" font-size="22" font-weight="bold" fill="#173b2b">with open(...) as f:</text><text x="55" y="742" font-family="Arial" font-size="19" fill="#294b3a">작업이 끝나면 파일을 자동으로 닫습니다.</text><text x="55" y="780" font-family="Arial" font-size="19" fill="#294b3a">예외가 발생해도 자원 누수를 방지합니다.</text><text x="55" y="825" font-family="Arial" font-size="19" fill="#16804b">안전하고 간결한 파일 처리 방식입니다.</text>
<rect x="600" y="605" width="575" height="265" rx="18" fill="#fff" stroke="#9bb9d5" stroke-width="2"/><rect x="600" y="605" width="575" height="48" rx="14" fill="#16804b"/><text x="630" y="639" font-family="Arial" font-size="27" font-weight="bold" fill="#fff">⑤ 코드 예시</text>
<rect x="620" y="670" width="535" height="82" rx="10" fill="#eef5ff"/><text x="640" y="700" font-family="monospace" font-size="17" fill="#153a70">with open("a.txt", "r", encoding="utf-8") as f:</text><text x="660" y="730" font-family="monospace" font-size="18" fill="#153a70">data = f.read()</text>
<rect x="620" y="765" width="535" height="82" rx="10" fill="#f0fbf3"/><text x="640" y="795" font-family="monospace" font-size="17" fill="#17633a">with open("b.txt", "w", encoding="utf-8") as f:</text><text x="660" y="825" font-family="monospace" font-size="18" fill="#17633a">f.write("안녕")</text>
</svg>