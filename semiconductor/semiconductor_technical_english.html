let _v=null;function pickVoice(){const l=speechSynthesis.getVoices();_v=l.find(v=>/^en[-_]US/i.test(v.lang))||l.find(v=>/^en/i.test(v.lang))||null}
if(window.speechSynthesis){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function toast(m){let d=document.getElementById('toast');if(!d){d=document.createElement('div');d.id='toast';d.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#10243a;color:#fff;padding:10px 16px;border-radius:10px;font-size:.9rem;z-index:99;max-width:90%';document.body.appendChild(d)}d.textContent=m;d.style.display='block';clearTimeout(d._t);d._t=setTimeout(()=>d.style.display='none',3500)}
function speak(t){t=String(t).trim();const ss=window.speechSynthesis;let done=false;
const fallback=()=>{if(done)return;done=true;try{const a=new Audio('https://translate.googleapis.com/translate_tts?ie=UTF-8&client=gtx&tl=en&q='+encodeURIComponent(t));a.play().catch(()=>toast('이 환경에서는 소리를 낼 수 없다. 크롬·엣지 브라우저에서 파일을 직접 열어 사용한다.'))}catch(e){toast('이 환경에서는 소리를 낼 수 없다. 크롬·엣지 브라우저에서 파일을 직접 열어 사용한다.')}};
if(!ss||!window.SpeechSynthesisUtterance){fallback();return}
ss.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.85;if(!_v)pickVoice();if(_v)u.voice=_v;
u.onstart=()=>{done=true};u.onerror=e=>{if(e.error!=='canceled'&&e.error!=='interrupted')fallback()};
setTimeout(()=>{ss.resume();ss.speak(u)},80);setTimeout(()=>{if(!done)fallback()},1800)}
let current=0, quizMode=false;
const nav=document.getElementById('navlist'), cat=document.getElementById('category'), content=document.getElementById('content');
modules.forEach((m,i)=>{let b=document.createElement('button');b.className='navbtn';b.textContent=String(i+1).padStart(2,'0')+'. '+m[0];b.onclick=()=>render(i);nav.appendChild(b);let o=document.createElement('option');o.value=i;o.textContent=String(i+1).padStart(2,'0')+'. '+m[0];cat.appendChild(o)});
function render(i){current=i;quizMode=false;document.querySelectorAll('.navbtn').forEach((b,j)=>b.classList.toggle('active',j===i));cat.value=i;let m=modules[i];content.innerHTML=`<h2 class="section-title">${String(i+1).padStart(2,'0')}. ${m[0]}</h2><p class="sub">학습 항목 ${m[2].length}개 · 듣기 · 의미 · 예문 · 한글 번역</p>`+m[2].map(w=>`<article class="word"><div class="word-top"><h3>${w[0]} <button class="spk" onclick="speak(this.parentNode.firstChild.textContent)">🔊</button></h3><span class="tag">${m[0]}</span></div>${w[1]?`<div class="pron">발음: ${w[1]}</div>`:''}<div class="meaning">${w[2]}</div><div class="example"><b>${w[3]}</b><div class="translation" id="tr-${i}-${m[2].indexOf(w)}">${w[4]}</div><button class="spk" style="margin-top:8px" onclick="speak(this.parentNode.querySelector('b').textContent)">🔊 듣기</button> <button class="primary" style="margin-top:8px" onclick="toggleTranslation('tr-${i}-${m[2].indexOf(w)}',this)">한글 번역</button></div></article>`).join('')+`<button class="primary" onclick="showQuiz()">이 모듈 복습 퀴즈</button>`}
function toggleTranslation(id,btn){
 const el=document.getElementById(id); if(!el)return;
 el.classList.toggle('show');
 btn.textContent=el.classList.contains('show')?'번역 숨기기':'한글 번역';
}
function showQuiz(){quizMode=true;let words=modules[current][2];let q=words.map((w,i)=>{let opts=[w[2],...words.filter((x,j)=>j!==i).map(x=>x[2])].sort(()=>Math.random()-.5);return `<div class="quiz-q"><b>${i+1}. '${w[0]}'의 뜻은?</b>${opts.map(o=>`<label><input type="radio" name="q${i}" value="${o}"> ${o}</label>`).join('')}<div class="feedback" id="f${i}"></div></div>`}).join('');content.innerHTML=`<h2 class="section-title">${modules[current][0]} 복습 퀴즈</h2><p class="sub">각 영어 용어에 해당하는 한국어 뜻을 선택한다.</p>${q}<button class="primary" onclick="grade()">채점하기</button> <button onclick="render(current)">학습으로 돌아가기</button><p id="score"></p>`}
function grade(){let words=modules[current][2],score=0;words.forEach((w,i)=>{let v=document.querySelector(`input[name=q${i}]:checked`);let ok=v&&v.value===w[2];if(ok)score++;let f=document.getElementById('f'+i);f.textContent=ok?'정답입니다.':'정답: '+w[2];f.style.color=ok?'#16835d':'#b54735'});document.getElementById('score').innerHTML=`<b>점수: ${score} / ${words.length}</b> · 정답과 해설을 확인하고 다시 학습한다.`}
document.getElementById('category').addEventListener('change',e=>render(Number(e.target.value)));
document.getElementById('search').addEventListener('input',e=>{let q=e.target.value.trim().toLowerCase();if(!q){render(current);return}let found=[];modules.forEach((m,i)=>m[2].forEach(w=>{if(w.join(' ').toLowerCase().includes(q))found.push({m,i,w})}));document.querySelectorAll('.navbtn').forEach(b=>b.classList.remove('active'));content.innerHTML=`<h2 class="section-title">검색 결과</h2><p class="sub">${found.length}개 용어를 찾았다.</p>`+(found.length?found.map(x=>`<article class="word"><div class="word-top"><h3>${x.w[0]} <button class="spk" onclick="speak(this.parentNode.firstChild.textContent)">🔊</button></h3><span class="tag">${x.m[0]}</span></div>${x.w[1]?`<div class="pron">발음: ${x.w[1]}</div>`:''}<div class="meaning">${x.w[2]}</div><div class="example"><b>${x.w[3]}</b><div class="translation" id="sr-${x.i}-${x.m[2].indexOf(x.w)}">${x.w[4]}</div><button class="spk" style="margin-top:8px" onclick="speak(this.parentNode.querySelector('b').textContent)">🔊 듣기</button> <button class="primary" style="margin-top:8px" onclick="toggleTranslation('sr-${x.i}-${x.m[2].indexOf(x.w)}',this)">한글 번역</button></div><button onclick="render(${x.i})">모듈에서 학습</button></article>`).join(''):'검색 결과가 없다.')});
document.getElementById('wordCount').textContent=modules.reduce((a,m)=>a+m[2].length,0)+'개';
render(0);
