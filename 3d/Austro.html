<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Austro 한반도 사계절 천문대 — 시간별 별자리</title>
<style>body{margin:0;overflow:hidden;background:#020613;color:#e0eeff;font:14px system-ui}canvas{display:block}#ui{position:fixed;top:14px;left:14px;z-index:2;background:#071426e8;padding:16px;border:1px solid #345573;border-radius:14px;width:min(360px,calc(100vw - 60px));max-height:calc(100vh - 28px);overflow:auto;backdrop-filter:blur(8px)}#viewHelp{position:fixed;right:14px;bottom:14px;z-index:2;padding:9px 12px;border:1px solid #345573;border-radius:10px;background:#071426cc;color:#d9edff;pointer-events:none;font-size:12px}canvas{touch-action:none} @media(max-width:600px){#ui{top:8px;left:8px;padding:10px;max-height:48vh;width:min(310px,calc(100vw - 44px));font-size:12px}#viewHelp{right:8px;bottom:8px;font-size:11px}}h2{margin:0 0 8px}button,select,input{margin:3px;padding:7px;background:#183047;color:white;border:1px solid #55728c;border-radius:6px;font:inherit}button:hover{background:#22456a}p{line-height:1.5;margin:8px 0}label{display:inline-flex;align-items:center;gap:5px}#time{width:100%}#speed{width:100%}#err{color:#ffbb99}small{opacity:.7;line-height:1.4}</style>
<div id="ui"><h2>✦ AUSTRO 사계절 천문대</h2>
<div><button data-s="spring">봄</button><button data-s="summer">여름</button><button data-s="autumn">가을</button><button data-s="winter">겨울</button></div>
<p>관측 위치 <select id="place"><option value="37.5665,126.978">서울</option><option value="35.1796,129.0756">부산</option><option value="33.4996,126.5312">제주</option><option value="39.0392,125.7625">평양</option><option value="36.3504,127.3845">대전</option><option value="35.8714,128.6014">대구</option></select></p>
<p>관측 시각 <input id="time" type="datetime-local" step="60"></p>
<div><button id="now">현재 시각</button><button id="play">▶ 시간 흐름</button><button id="stop">⏸ 정지</button></div>
<p>시간 흐름 속도 <input id="speed" type="range" min="1" max="2000" value="120"><span id="speedLabel">120배</span></p>
<p>별자리 <select id="target"></select> <button id="goto">찾아보기</button></p>
<p><label><input type="checkbox" id="lines" checked>별자리 선</label><label><input type="checkbox" id="names" checked>이름</label></p>
<button id="scope">🔭 망원경 관측 [E]</button><button id="reset">전체 하늘</button>
<p id="info"></p>
<p>마우스 드래그: 하늘 전체 회전 · 휠: 확대/축소<br>더블클릭: 정면으로 복귀 · VR: 컨트롤러 조준</p>
<small>교육용 시뮬레이션입니다. 근사 항성시와 J2000 항성 좌표를 사용하며, 실시간 천체력·대기 굴절·행성 운동은 단순화했습니다. 별자리 선은 학습용으로 강조한 것입니다.</small>
<p id="err"></p></div><div id="viewHelp">마우스 드래그: 전체 하늘 관찰 · 휠: 확대/축소 · 더블클릭: 시점 초기화</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
<script type="module">
import * as T from 'three';import{VRButton}from'three/addons/webxr/VRButton.js';
const $=s=>document.querySelector(s),D2R=Math.PI/180;
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.xr.enabled=true;document.body.append(renderer.domElement,VRButton.createButton(renderer));
const scene=new T.Scene();scene.background=new T.Color('#020613');
const camera=new T.PerspectiveCamera(65,innerWidth/innerHeight,.05,1800);const rig=new T.Group();rig.add(camera);scene.add(rig);camera.position.y=1.65;
// Bright-star catalog: right ascension hours, declination degrees, visual magnitude (J2000 approximations).
const stars={reg:[10.139,11.97,1.35],den:[11.817,14.57,2.14],alg:[10.333,19.84,2.01],zos:[11.235,20.52,2.56],eps:[9.764,23.77,2.98],eta:[10.122,16.76,3.49],arc:[14.261,19.18,-.05],iza:[14.75,27.07,2.37],nek:[15.032,40.39,3.5],seg:[14.534,38.31,3.03],mup:[13.912,18.4,2.68],spi:[13.42,-11.16,.98],por:[12.694,-1.45,2.74],vin:[13.036,10.96,2.83],zav:[11.845,1.76,3.61],vega:[18.616,38.78,.03],she:[18.835,33.36,3.52],sul:[18.982,32.69,3.25],dly:[18.909,36.9,4.3],zly:[18.746,37.6,4.3],deb:[20.691,45.28,1.25],sad:[20.37,40.26,2.23],alb:[19.512,27.96,3.05],gcy:[20.77,33.97,2.46],dcy:[19.75,45.13,2.87],alt:[19.846,8.87,.77],tar:[19.771,10.61,2.72],ash:[19.922,6.41,3.71],daq:[19.425,3.11,3.36],zaq:[19.09,13.86,2.99],ant:[16.49,-26.43,1.06],acr:[16.09,-19.81,2.62],dsc:[16.006,-22.62,2.32],esc:[16.836,-34.29,2.29],msc:[16.864,-38.05,3.08],sha:[17.56,-37.1,1.62],les:[17.512,-37.3,2.7],mar:[23.079,15.21,2.49],sch:[23.063,28.08,2.42],algp:[.22,15.18,2.83],alp:[.14,29.09,2.06],mir:[1.162,35.62,2.06],alm:[2.065,42.33,2.1],scha:[.675,56.54,2.24],caph:[.153,59.15,2.28],gcas:[.945,60.72,2.15],ruc:[1.43,60.24,2.68],segc:[1.906,63.67,3.35],ham:[2.12,23.46,2],sher:[1.911,20.81,2.64],mes:[1.885,19.29,3.88],bet:[5.919,7.41,.5],rig:[5.242,-8.2,.13],bel:[5.419,6.35,1.64],sai:[5.796,-9.67,2.06],aln:[5.679,-1.94,1.74],almn:[5.603,-1.2,1.69],min:[5.533,-.3,2.23],mei:[5.585,9.93,3.39],sir:[6.752,-16.72,-1.46],mur:[6.378,-17.96,1.98],wez:[7.14,-26.39,1.83],adh:[6.977,-28.97,1.5],pro:[7.655,5.23,.34],gom:[7.453,8.29,2.9],ald:[4.599,16.51,.85],eln:[5.438,28.61,1.65],zta:[5.627,21.14,3],tht:[4.478,15.96,3.8],gam:[4.33,15.63,3.65],cap:[5.278,45.99,.08],men:[5.992,44.95,1.9],aur:[5.995,37.21,2.62],hass:[4.95,33.17,2.69],pol:[2.53,89.26,1.98]};
const groups=[['사자자리','spring',['reg','eta','alg','zos','den','reg'],[['alg','eps']],'reg'],['목동자리','spring',['arc','iza','nek','seg','mup','arc'],[],'arc'],['처녀자리','spring',['spi','por','zav'],[['por','vin']],'spi'],['거문고자리','summer',['vega','zly','she','sul','dly','zly'],[],'vega'],['백조자리','summer',['deb','sad','alb'],[['dcy','sad','gcy']],'sad'],['독수리자리','summer',['tar','alt','ash','daq','zaq','alt'],[],'alt'],['전갈자리','summer',['acr','dsc','ant','esc','msc','les','sha'],[],'ant'],['페가수스자리','autumn',['mar','sch','alp','algp','mar'],[],'mar'],['안드로메다자리','autumn',['alp','mir','alm'],[],'mir'],['카시오페이아자리','autumn',['caph','scha','gcas','ruc','segc'],[],'gcas'],['양자리','autumn',['ham','sher','mes'],[],'ham'],['오리온자리','winter',['bet','bel','min','rig','sai','aln','bet'],[['min','almn','aln'],['bel','mei','bet']],'bet'],['큰개자리','winter',['sir','mur','adh','wez','sir'],[],'sir'],['작은개자리','winter',['pro','gom'],[],'pro'],['황소자리','winter',['eln','ald','zta'],[['ald','tht','gam']],'ald'],['마차부자리','winter',['cap','men','aur','eln','hass','cap'],[],'cap']];
const presets={spring:['2026-05-01T21:00'],summer:['2026-08-01T21:00'],autumn:['2026-11-01T21:00'],winter:['2026-02-01T21:00']};
let latitude=37.5665,longitude=126.978,season='winter',simTime=new Date('2026-02-01T21:00'),playing=false,speed=120,scope=false,yaw=0,pitch=.5;
const sky=new T.Group();scene.add(sky);let lines=[],labels=[],points={};
// Local sidereal time in hours; approximate but suitable for a visual planetarium.
function lstHours(date,lonDeg){const jd=date.getTime()/86400000+2440587.5;const d=jd-2451545;let gmst=(18.697374558+24.06570982441908*d)%24;if(gmst<0)gmst+=24;let lst=(gmst+lonDeg/15)%24;if(lst<0)lst+=24;return lst}
// Horizon coordinates: x east, y up, z south. This makes constellations rise in the east and set in the west.
function horizon(raHours,decDeg,lst){const H=(lst-raHours)*15*D2R,d=decDeg*D2R,l=latitude*D2R;const y=Math.sin(d)*Math.sin(l)+Math.cos(d)*Math.cos(l)*Math.cos(H);const x=-Math.cos(d)*Math.sin(H);const z=Math.sin(d)*Math.cos(l)-Math.cos(d)*Math.cos(l)*Math.sin(H);return new T.Vector3(x,y,z).multiplyScalar(500)}
function glowTexture(){const c=document.createElement('canvas');c.width=64;c.height=64;const x=c.getContext('2d');const g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'#fff');g.addColorStop(.18,'#fff');g.addColorStop(.42,'rgba(170,205,255,.55)');g.addColorStop(1,'rgba(90,150,255,0)');x.fillStyle=g;x.fillRect(0,0,64,64);return new T.CanvasTexture(c)}
const glow=glowTexture();
function textSprite(str,p,size=14){const c=document.createElement('canvas');c.width=512;c.height=96;const x=c.getContext('2d');x.font='bold 42px sans-serif';x.textAlign='center';x.strokeStyle='#020613';x.lineWidth=8;x.strokeText(str,256,62);x.fillStyle='#b9e9ff';x.fillText(str,256,62);const tex=new T.CanvasTexture(c);const sprite=new T.Sprite(new T.SpriteMaterial({map:tex,depthTest:false}));sprite.position.copy(p);sprite.scale.set(size*4,size*.75,1);sky.add(sprite);return sprite}
function rebuild(){while(sky.children.length){const child=sky.children[0];sky.remove(child);child.geometry?.dispose();if(child.material){if(child.material.map&&child.material.map!==glow)child.material.map.dispose();child.material.dispose()}}points={};lines=[];labels=[];
// Static faint stars for depth; they do not represent a real catalog.
let seed=91;const rand=()=>{seed=(1664525*seed+1013904223)>>>0;return seed/4294967296};const arr=[];for(let i=0;i<5200;i++){const a=rand()*Math.PI*2,y=rand()*2-1,s=Math.sqrt(1-y*y);arr.push(520*s*Math.sin(a),520*y,520*s*Math.cos(a))}const bg=new T.BufferGeometry();bg.setAttribute('position',new T.Float32BufferAttribute(arr,3));sky.add(new T.Points(bg,new T.PointsMaterial({color:0x8191b0,size:1.2,sizeAttenuation:false})));
const lst=lstHours(simTime,longitude);
for(const[id,[ra,dec,mag]]of Object.entries(stars)){const p=horizon(ra,dec,lst);points[id]=p;const o=new T.Sprite(new T.SpriteMaterial({map:glow,color:['bet','ald','ant','arc'].includes(id)?0xffbd83:0xdbeaff,depthWrite:false,transparent:true}));o.position.copy(p);o.scale.setScalar(Math.max(5.5,12-mag*1.5));sky.add(o)}
for(const[name,s,chain,branches,anchor]of groups){if(s!==season)continue;for(const path of[chain,...branches]){for(let i=1;i<path.length;i++){const a=points[path[i-1]],b=points[path[i]];const line=new T.Line(new T.BufferGeometry().setFromPoints([a,b]),new T.LineBasicMaterial({color:0x59b8e0,transparent:true,opacity:.72}));line.visible=$('#lines').checked;sky.add(line);lines.push(line)}}{const p=points[anchor].clone();p.y+=13;const l=textSprite(name,p,9);l.visible=$('#names').checked;labels.push(l)}}
textSprite('북 N',new T.Vector3(0,20,470),12);textSprite('남 S',new T.Vector3(0,20,-470),12);textSprite('동 E',new T.Vector3(470,20,0),12);textSprite('서 W',new T.Vector3(-470,20,0),12);
$('#target').innerHTML=groups.filter(g=>g[1]===season).map(g=>`<option value="${g[4]}">${g[0]}</option>`).join('');updateInfo();aim($('#target').value)}
function updateInfo(){const lst=lstHours(simTime,longitude);const hh=Math.floor(lst),mm=Math.floor((lst-hh)*60);$('#info').textContent=`${seasonsName()} · ${simTime.toLocaleString('ko-KR')}\n현지 항성시 ${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}\n위도 ${latitude.toFixed(2)}°N, 경도 ${longitude.toFixed(2)}°E`}
function seasonsName(){return{spring:'봄',summer:'여름',autumn:'가을',winter:'겨울'}[season]}
function aim(id){const p=points[id];if(!p)return;yaw=Math.atan2(-p.x,-p.z);pitch=Math.asin(T.MathUtils.clamp(p.y/p.length(),-1,1))}
const ground=new T.Mesh(new T.CircleGeometry(50,80),new T.MeshBasicMaterial({color:0x08121c}));ground.rotation.x=-Math.PI/2;ground.position.y=-.05;scene.add(ground);
const wall=new T.Mesh(new T.CylinderGeometry(8,8,.7,64,1,true),new T.MeshBasicMaterial({color:0x22374a,side:T.DoubleSide}));wall.position.y=.3;scene.add(wall);
const scopeMesh=new T.Group();scopeMesh.position.set(0,1,-2);const tube=new T.Mesh(new T.CylinderGeometry(.16,.2,1.4,24),new T.MeshNormalMaterial());tube.rotation.x=Math.PI/2;scopeMesh.add(tube);scene.add(scopeMesh);
function toggle(){scope=!scope;camera.fov=scope?10:65;camera.updateProjectionMatrix();$('#scope').textContent=scope?'관측 종료 [E]':'🔭 망원경 관측 [E]'}
$('#scope').onclick=toggle;function resetView(){scope=false;camera.fov=65;camera.updateProjectionMatrix();$('#scope').textContent='🔭 망원경 관측 [E]';aim($('#target').value)}$('#reset').onclick=resetView;$('#goto').onclick=()=>aim($('#target').value);
$('#place').onchange=e=>{const[lat,lon]=e.target.value.split(',').map(Number);latitude=lat;longitude=lon;rebuild()};
$('#time').onchange=e=>{const d=new Date(e.target.value);if(!isNaN(d)){simTime=d;rebuild()}};
$('#now').onclick=()=>{const d=new Date();d.setSeconds(0,0);simTime=d;const iso=new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);$('#time').value=iso;rebuild()};
$('#play').onclick=()=>playing=true;$('#stop').onclick=()=>playing=false;
$('#speed').oninput=e=>{speed=+e.target.value;$('#speedLabel').textContent=speed+'배'};
$('#ui > div').onclick=e=>{if(!e.target.dataset.s)return;season=e.target.dataset.s;simTime=new Date(presets[season][0]);const iso=new Date(simTime.getTime()-simTime.getTimezoneOffset()*60000).toISOString().slice(0,16);$('#time').value=iso;rebuild()};
$('#lines').onchange=e=>lines.forEach(l=>l.visible=e.target.checked);$('#names').onchange=e=>labels.forEach(l=>l.visible=e.target.checked);
let down=false,lastX=0,lastY=0,dragged=false;const canvas=renderer.domElement;canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;down=true;dragged=false;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointerup',()=>{down=false});canvas.addEventListener('pointercancel',()=>{down=false});canvas.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;if(Math.abs(dx)+Math.abs(dy)>2)dragged=true;yaw-=dx*.004;pitch=T.MathUtils.clamp(pitch+dy*.004,-1.45,1.45);lastX=e.clientX;lastY=e.clientY});canvas.addEventListener('wheel',e=>{e.preventDefault();camera.fov=T.MathUtils.clamp(camera.fov+e.deltaY*.025,8,100);camera.updateProjectionMatrix()},{passive:false});canvas.addEventListener('dblclick',e=>{e.preventDefault();resetView()});canvas.addEventListener('contextmenu',e=>e.preventDefault());addEventListener('keydown',e=>{if(e.code==='KeyE')toggle()});
const controllers=[];for(let i=0;i<2;i++){const c=renderer.xr.getController(i);scene.add(c);c.addEventListener('selectstart',()=>{if(c.visible){const dir=new T.Vector3(0,0,-1).applyQuaternion(c.getWorldQuaternion(new T.Quaternion()));yaw=Math.atan2(-dir.x,-dir.z);pitch=Math.asin(dir.y)}toggle()});controllers.push(c)}
const rt=new T.WebGLRenderTarget(1024,1024);const scopeCam=new T.PerspectiveCamera(9,1,.1,1800);scopeCam.position.y=1.65;const screen=new T.Mesh(new T.PlaneGeometry(1.1,1.1),new T.MeshBasicMaterial({map:rt.texture}));screen.position.set(0,0,-1);camera.add(screen);screen.visible=false;
renderer.xr.addEventListener('sessionend',()=>screen.visible=false);
const initial=new Date();initial.setSeconds(0,0);simTime=initial;const iso=new Date(initial.getTime()-initial.getTimezoneOffset()*60000).toISOString().slice(0,16);$('#time').value=iso;rebuild();
renderer.setAnimationLoop(()=>{const dt=Math.min(clock.getDelta(),.05);if(playing){simTime=new Date(simTime.getTime()+dt*speed*1000);const iso=new Date(simTime.getTime()-simTime.getTimezoneOffset()*60000).toISOString().slice(0,16);$('#time').value=iso;rebuild()}camera.rotation.set(pitch,yaw,0,'YXZ');scopeMesh.rotation.set(pitch,yaw,0,'YXZ');
if(renderer.xr.isPresenting&&scope){screen.visible=false;scopeCam.rotation.set(pitch,yaw,0,'YXZ');const enabled=renderer.xr.enabled;renderer.xr.enabled=false;renderer.setRenderTarget(rt);renderer.render(scene,scopeCam);renderer.setRenderTarget(null);renderer.xr.enabled=enabled;screen.visible=true}else{screen.visible=false;const desired=scope?10:65;if(scope)camera.fov=desired;camera.updateProjectionMatrix()}renderer.render(scene,camera)});
const clock=new T.Clock();addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()});
</script></html>
