<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3상 유도전동기 결선 실습 (PC·VR)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef3f8;--fg:#1b2733;--card:rgba(255,255,255,.95);--bd:#c9d5e1;--ac:#2a7fd4}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:#1d2329;color:var(--fg);font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;overflow:hidden}
canvas{display:block;touch-action:none}
#bar{position:absolute;left:8px;right:8px;top:calc(8px + env(safe-area-inset-top,0px));display:flex;flex-wrap:wrap;gap:6px}
button{background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}
button:disabled{opacity:.5}
#side{position:absolute;right:8px;top:calc(56px + env(safe-area-inset-top,0px));width:200px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.55}
#side h4{margin:0 0 4px;font-size:13px}
#side hr{border:0;border-top:1px solid var(--bd);margin:6px 0}
#msg{position:absolute;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));max-height:36%;overflow:auto;background:var(--card);border:1px solid var(--bd);border-left:6px solid #888;border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.5}
#msg b{display:block;font-size:16px;margin-bottom:4px}
#msg ul{margin:4px 0 0;padding-left:18px}
#msg small{opacity:.65}
.ov{position:absolute;inset:0;background:rgba(20,30,40,.55);display:none;align-items:center;justify-content:center;padding:12px;z-index:5}
.ov.on{display:flex}
.box{background:#fff;border-radius:12px;max-width:900px;width:100%;max-height:100%;overflow:auto;padding:16px 20px;font-size:14px;line-height:1.65}
.box h2{margin:0 0 8px;font-size:20px}.st{position:sticky;top:-16px;z-index:2;background:#fff;margin:-16px -20px 10px;padding:10px 20px;border-bottom:1px solid var(--bd);text-align:right}.hd{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}.ht{flex:1 1 240px;min-width:0}.hi{flex:0 1 380px;width:380px;max-width:100%;border:1px solid var(--bd);border-radius:8px;cursor:zoom-in}.hi.big{flex:1 1 100%;width:100%;cursor:zoom-out}.box h3{margin:14px 0 4px;font-size:15px;color:#1f4e8c}
.box table{border-collapse:collapse;width:100%;font-size:13px;display:block;overflow-x:auto}
.box td,.box th{border:1px solid var(--bd);padding:4px 8px;text-align:left}.box th{background:#eef3f8}
.box code{background:#eef3f8;padding:1px 5px;border-radius:4px}
</style>
</head>

</div>

<h3>1. 단자 이해하기</h3>
<table><tr><th>기호</th><th>의미</th></tr>
<tr><td>R, S, T</td><td>3상 전원 (적·황·청)</td></tr>
<tr><td>U–X, V–Y, W–Z</td><td>전동기 내부 권선 3개 (각각 코일의 시작–끝)</td></tr>
<tr><td>단자 표기 대응</td><td>위 그림의 U1·V1·W1·U2·V2·W2 = 본 실습의 U·V·W·X·Y·Z (U2=X, V2=Y, W2=Z)</td></tr>
<tr><td>PE / E</td><td>PE = 전원 측 접지(보호도체), E = 전동기 프레임 접지</td></tr></table>
<h3>2. 결선 방법</h3>
<table><tr><th>결선</th><th>연결</th><th>권선에 걸리는 전압</th></tr>
<tr><td>Y (스타)</td><td>X·Y·Z를 한 점에 묶고, R→U, S→V, T→W</td><td>선간전압 ÷ √3</td></tr>
<tr><td>Δ (델타)</td><td>U–Z, V–X, W–Y 점퍼 연결 후, R→U, S→V, T→W</td><td>선간전압 그대로</td></tr></table>
<h3>3. 명판 읽기</h3>
<p>명판의 <b>정격 권선전압</b>(예: 220/380V Δ/Y)은 "Δ일 때 220V, Y일 때 380V"로 쓰도록 만든 전동기라는 뜻입니다. 각 권선이 받는 전압이 정격과 같아지도록 결선하세요. 전원 전압은 상단 버튼으로 220V/380V를 바꿉니다.</p>
<h3>4. 실습 순서</h3>
<ol><li>명판과 전원 전압을 확인한다.</li><li>필요한 결선(Y/Δ)을 판단한다.</li><li>단자를 클릭 → 다른 단자를 클릭하여 전선을 연결한다. (전선 클릭 = 삭제)</li><li>R·S·T를 U·V·W에 연결한다.</li><li><b>PE–E 접지선</b>을 연결한다.</li><li>[결선 검사]를 누르고 메시지에 따라 수정한다. 성공하면 전동기가 회전한다.</li></ol>
<h3>5. 오류 유형</h3>

  const c=id=>f(id),S=['R','S','T'],M=['U','V','W'],Zs=['X','Y','Z'],LIVE=[...S,...M,...Zs];
  const err=[],E=(k,t)=>{if(!keys.includes(k))keys.push(k);err.push(t)};
  for(let i=0;i<3;i++)for(let j=i+1;j<3;j++)if(c(S[i])===c(S[j]))E('SHORT',S[i]+'–'+S[j]+' 전원 단락! 차단기 트립·화재 위험. 전원 단자끼리(또는 같은 점으로) 연결되었습니다.');
  [['U','X'],['V','Y'],['W','Z']].forEach(([a,b])=>{if(c(a)===c(b))E('WSHORT',a+'–'+b+' 동일 권선의 양 끝이 연결됨 → 권선 단락. U–X, V–Y, W–Z는 서로 다른 점에 두어야 합니다.')});
  ['PE','E'].forEach(g=>{const hit=LIVE.filter(t=>c(t)===c(g));if(hit.length)E('GND_LIVE',g+' 접지 단자가 충전부('+hit.join(', ')+')와 연결됨 → 프레임·접지에 전압이 걸려 감전·지락 위험!')});
  if(err.length)return fail('❌ 결선 오류 (위험)',err);
  const miss=S.filter(s=>!M.concat(Zs).some(t=>c(t)===c(s)));
  if(miss.length===3){keys.push('OPEN');return fail('⚠ 전원 미연결',['R·S·T 전원이 전동기 단자에 연결되지 않았습니다. 전동기는 정지 상태입니다.'],'warn')}
  if(miss.length){keys.push('OPEN');return fail('❌ 결상(단상 운전) 위험',[miss.join(', ')+' 상이 전동기에 연결되지 않았습니다.','2상만 공급되면 토크 부족·과전류로 과열·소손될 수 있습니다 (결상 보호 계전기 필요).'])}
  let type=null,m=null;const cz=Zs.map(c);
  if(cz[0]===cz[1]&&cz[1]===cz[2]&&!S.some(s=>c(s)===cz[0])){const q=M.map(u=>S.findIndex(s=>c(s)===c(u)));if(q.every(x=>x>=0)&&new Set(q).size===3){type='Y';m=q}}
  if(!type){const pr=[['U','Z'],['V','X'],['W','Y']];if(pr.every(([a,b])=>c(a)===c(b))){const q=pr.map(([a])=>S.findIndex(s=>c(s)===c(a)));if(q.every(x=>x>=0)&&new Set(q).size===3){type='D';m=q}}}
  if(!type){
    if(Zs.some(z=>S.some(s=>c(s)===c(z))))E('INCOMPLETE','X·Y·Z 단자 중 일부가 전원에 연결되었습니다. 권선 불평형·단락 전류가 발생합니다.');
    const same=(cz[0]===cz[1])+(cz[1]===cz[2])+(cz[0]===cz[2]);
    if(same===1)E('INCOMPLETE','Y 결선 미완성: X·Y·Z 중 2개만 묶였습니다. 3개를 모두 한 점에 묶어야 합니다.');
    const jp=[['U','Z'],['V','X'],['W','Y']].filter(([a,b])=>c(a)===c(b)).length;
    if(jp>0&&jp<3)E('INCOMPLETE','Δ 결선 미완성: 점퍼 '+jp+'/3 (U–Z, V–X, W–Y 3개 필요).');
    const un=M.filter(u=>!S.some(s=>c(s)===c(u)));
    if(un.length)E('INCOMPLETE',un.join(', ')+' 단자에 전원이 공급되지 않습니다.');
    const dup=S.filter(s=>M.filter(u=>c(u)===c(s)).length>1);
    if(dup.length)E('DUP',dup.join(', ')+' 상이 U·V·W 중 두 단자 이상에 연결되었습니다 (상 중복).');
    if(!err.length)E('OTHER','Y 결선도 Δ 결선도 아닙니다. Y = X·Y·Z 한 점 묶음 / Δ = U–Z, V–X, W–Y 점퍼. 전원 R·S·T는 U·V·W에 하나씩.');
    return fail('❌ 결선 오류',err)}
  const P=plates[pi],Vapp=type==='Y'?Vs/Math.sqrt(3):Vs,r=Vapp/P.vw,tn=type==='Y'?'Y(스타)':'Δ(델타)';
  const lines=[tn+' 결선 인식. 권선 인가전압 약 '+Math.round(Vapp)+'V (명판 권선전압 '+P.vw+'V의 '+Math.round(r*100)+'%).'];
  if(r>1.1){keys.push('OVERV');lines.push('권선 전압이 명판 정격을 초과합니다 → 과전류로 전동기 소손 위험! 전원 전압과 명판에 맞는 결선을 선택하세요.');return fail('❌ 과전압 결선',lines)}
  if(r<.9){keys.push('UNDERV');lines.push('권선 전압이 정격보다 낮아 토크가 크게 부족합니다(Y 기동 수준). 전동기가 정격 출력을 낼 수 없습니다.');spinDir=1;spinSpd=3*r;return fail('⚠ 저전압 결선',lines,'warn')}
  if(c('PE')!==c('E')){keys.push('GND_MISS');lines.push('PE–E 접지선이 연결되지 않았습니다. 절연 불량 시 프레임에 전압이 걸려 감전됩니다. 접지 없이는 운전할 수 없습니다.');return fail('❌ 접지 미연결',lines)}
  const rev=inv(m)%2===1;
  if(rev){keys.push('REV');lines.push('상순이 R-S-T ↔ U-V-W 순서가 아니어서 역회전합니다. 전원 2선을 서로 바꾸세요.');spinDir=-1;spinSpd=9;return fail('⚠ 역회전',lines,'warn')}
  spinDir=1;spinSpd=9;finished=true;endT=Date.now();
  const sec=elapsed(),dangers=Object.keys(errs).reduce((n,k)=>n+(DANGER.includes(k)?errs[k]:0),0);
  const score=Math.max(0,100-8*(attempts-1)-7*dangers-Math.min(20,Math.max(0,Math.floor((sec-180)/15))));
  const grade=score>=90?'A':score>=75?'B':score>=60?'C':'D';
  result={score,grade};saveHist({d:new Date().toLocaleString('ko-KR'),p:P.n.slice(0,2),v:Vs,a:attempts,t:sec,s:score,g:grade});
  lines.push('접지 정상 · 상순 정상 · 정회전 운전! 🎉');lines.push('시도 '+attempts+'회 · '+fmt(sec)+' · <b>'+score+'점 ('+grade+')</b> — [기록] 버튼에서 상세 확인');
  setMsg('✅ 결선 성공',lines,'ok');
}
function resetAll(msg){wires.splice(0).forEach(w=>{world.remove(w.mesh);w.mesh.geometry.dispose()});setSel(null);spinDir=0;attempts=0;errs={};startT=endT=null;finished=false;result=null;
  setMsg(msg||'새 실습',['명판과 전원 전압을 확인하고, 필요한 결선과 접지선을 연결하세요.'],'info')}
function cyclePlate(){pi=(pi+1)%plates.length;resetAll('명판 변경: '+plates[pi].n+' ('+plates[pi].lab+')')}
function cycleVolt(){Vs=Vs===380?220:380;resetAll('전원 전압 변경: '+Vs+'V')}
function act(a){a==='check'?check():a==='clear'?resetAll():a==='plate'?cyclePlate():cycleVolt()}
$('bCheck').onclick=check;$('bClear').onclick=()=>resetAll();$('bPlate').onclick=cyclePlate;$('bVolt').onclick=cycleVolt;

function pick(ray){
  const h=ray.intersectObjects([...tmesh,...wires.map(w=>w.mesh),...btns],false)[0];if(!h)return;
  const u=h.object.userData;
  if(u.type==='btn')act(u.act);
  else if(u.type==='wire'){const i=wires.findIndex(w=>w.mesh===h.object);const w=wires.splice(i,1)[0];world.remove(w.mesh);setMsg('전선 제거',[w.a+'–'+w.b+' 연결을 삭제했습니다.'],'info')}
  else{startTimer();
    if(!sel){setSel(u.id);setMsg('단자 선택',[u.id+' 단자 선택됨. 연결할 다른 단자를 클릭하세요.'],'info')}
    else if(sel===u.id)setSel(null);
    else{addWire(sel,u.id);setMsg('전선 연결',[sel+'–'+u.id+' 연결됨. (전선을 클릭하면 삭제)'],'info');setSel(null)}}
}

let th=0,ph=1.35,rad=13;const tg=new T.Vector3(.7,-.2,-.5);
function cam(){camera.position.set(tg.x+rad*Math.sin(ph)*Math.sin(th),tg.y+rad*Math.cos(ph),tg.z+rad*Math.sin(ph)*Math.cos(th));camera.lookAt(tg)}
const cv=renderer.domElement,ray=new T.Raycaster(),mp=new T.Vector2();let down=null;
cv.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,moved:false}});
cv.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-down.x,dy=e.clientY-down.y;
  if(Math.abs(dx)+Math.abs(dy)>5)down.moved=true;
  if(down.moved){th-=dx*.006;ph=Math.min(2.2,Math.max(.6,ph-dy*.006));down.x=e.clientX;down.y=e.clientY}});
cv.addEventListener('pointerup',e=>{if(down&&!down.moved){const r=cv.getBoundingClientRect();mp.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);ray.setFromCamera(mp,camera);pick(ray)}down=null});
cv.addEventListener('wheel',e=>{rad=Math.min(25,Math.max(5,rad+e.deltaY*.01));e.preventDefault()},{passive:false});

const tmp=new T.Matrix4(),rc=new T.Raycaster();
for(let i=0;i<2;i++){
  const c=renderer.xr.getController(i);
  c.add(new T.Line(new T.BufferGeometry().setFromPoints([new T.Vector3(),new T.Vector3(0,0,-3)]),new T.LineBasicMaterial({color:0x2a7fd4})));
  c.addEventListener('select',()=>{tmp.identity().extractRotation(c.matrixWorld);rc.ray.origin.setFromMatrixPosition(c.matrixWorld);rc.ray.direction.set(0,0,-1).applyMatrix4(tmp);pick(rc)});
  scene.add(c);
}
renderer.xr.addEventListener('sessionstart',()=>{world.scale.setScalar(.22);world.position.set(-.15,1.25,-1.1);hud.visible=true});
renderer.xr.addEventListener('sessionend',()=>{world.scale.setScalar(1);world.position.set(0,0,0);hud.visible=false});
const bVR=$('bVR');
if(navigator.xr){navigator.xr.isSessionSupported('immersive-vr').then(ok=>{
  if(!ok){bVR.textContent='VR 미지원 (PC 모드)';bVR.disabled=true;return}
  bVR.textContent='VR 시작';bVR.className='p';
  bVR.onclick=()=>navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor']}).then(s=>{renderer.xr.setReferenceSpaceType('local-floor');renderer.xr.setSession(s)});
}).catch(()=>{bVR.textContent='VR 미지원';bVR.disabled=true})}
else{bVR.textContent='VR 미지원 (PC 모드)';bVR.disabled=true}

function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();renderSide();
setMsg('결선 실습 시작',['명판(정격 권선전압)과 전원 전압을 보고 Y 또는 Δ 결선을 판단하세요.','단자를 차례로 클릭해 전선을 연결합니다. 접지선(PE–E)도 잊지 마세요.','완성 후 [결선 검사]를 누르세요.'],'info');
const clock=new T.Clock();
renderer.setAnimationLoop(()=>{const dt=clock.getDelta();fan.rotation.x+=spinDir*spinSpd*dt;if(!renderer.xr.isPresenting)cam();renderer.render(scene,camera)});
})();
</script>
