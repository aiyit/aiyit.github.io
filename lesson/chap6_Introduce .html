<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chap 6 - CSS 디자인 소개</title>
    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            background: #f5f7fa;
            font-family: Arial, "Noto Sans KR", sans-serif;
        }
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }
        h1 {
            margin: 10px 0 20px;
            font-size: 28px;
            color: #222;
        }
        .image-box {
            background: white;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.12);
        }
        img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 8px;
        }
        .caption {
            margin-top: 12px;
            color: #555;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>모바일 웹 디자인을 위한 필수 CSS 핵심 가이드</h1>

        <div class="image-box">
            <img src="../img/chap6.png" alt="모바일 웹 디자인을 위한 필수 CSS 핵심 가이드">
        </div>

        <div class="caption">
            Chap 6. CSS 디자인 소개
        </div>
    </div>
</body>
</html>
