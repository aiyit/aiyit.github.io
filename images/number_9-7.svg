<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
<defs><linearGradient id="blue" x2="1"><stop stop-color="#063875"/><stop offset="1" stop-color="#1472c8"/></linearGradient><linearGradient id="purple" x2="1"><stop stop-color="#5520a5"/><stop offset="1" stop-color="#8d36c9"/></linearGradient><linearGradient id="pale" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#edf5ff"/></linearGradient></defs>
<rect width="1200" height="820" rx="24" fill="url(#pale)"/>
<rect x="12" y="12" width="1176" height="88" rx="20" fill="url(#blue)"/>
<text x="600" y="70" font-family="Arial,sans-serif" font-size="48" font-weight="bold" fill="#fff" text-anchor="middle">JavaScript Number 객체의 속성과 메소드</text>
<rect x="20" y="120" width="555" height="510" rx="18" fill="#fff" stroke="#5c9ce8" stroke-width="3"/>
<rect x="20" y="120" width="555" height="62" rx="16" fill="url(#blue)"/>
<text x="297" y="162" font-family="Arial" font-size="31" font-weight="bold" fill="#ffe45b" text-anchor="middle">Number 객체의 속성 (Property)</text>
<text x="297" y="210" font-family="Arial" font-size="20" fill="#173e69" text-anchor="middle">숫자와 관련된 상수 값과 정보를 제공합니다.</text>
<g font-family="Arial,sans-serif" fill="#17324d">
<circle cx="55" cy="260" r="20" fill="#1769d2"/><text x="55" y="267" font-size="21" font-weight="bold" fill="#fff" text-anchor="middle">1</text><text x="88" y="252" font-size="19" font-weight="bold">MAX_VALUE</text><text x="88" y="276" font-size="15" fill="#45627f">표현 가능한 가장 큰 양수</text><rect x="300" y="230" width="255" height="48" rx="10" fill="#e6f1ff" stroke="#8bb8ef" stroke-width="2"/><text x="312" y="250" font-size="14">Number.MAX_VALUE</text><text x="312" y="270" font-size="16" font-weight="bold" fill="#0756ad">1.7976931348623157e+308</text><circle cx="55" cy="330" r="20" fill="#1769d2"/><text x="55" y="337" font-size="21" font-weight="bold" fill="#fff" text-anchor="middle">2</text><text x="88" y="322" font-size="19" font-weight="bold">MIN_VALUE</text><text x="88" y="346" font-size="15" fill="#45627f">0에 가장 가까운 양수</text><rect x="300" y="300" width="255" height="48" rx="10" fill="#e6f1ff" stroke="#8bb8ef" stroke-width="2"/><text x="312" y="320" font-size="14">Number.MIN_VALUE</text><text x="312" y="340" font-size="16" font-weight="bold" fill="#0756ad">5e-324</text><circle cx="55" cy="400" r="20" fill="#1769d2"/><text x="55" y="407" font-size="21" font-weight="bold" fill="#fff" text-anchor="middle">3</text><text x="88" y="392" font-size="19" font-weight="bold">NaN</text><text x="88" y="416" font-size="15" fill="#45627f">숫자가 아님을 나타내는 값</text><rect x="300" y="370" width="255" height="48" rx="10" fill="#e6f1ff" stroke="#8bb8ef" stroke-width="2"/><text x="312" y="390" font-size="14">Number.NaN</text><text x="312" y="410" font-size="16" font-weight="bold" fill="#0756ad">NaN</text><circle cx="55" cy="470" r="20" fill="#1769d2"/><text x="55" y="477" font-size="21" font-weight="bold" fill="#fff" text-anchor="middle">4</text><text x="88" y="462" font-size="19" font-weight="bold">POSITIVE_INFINITY</text><text x="88" y="486" font-size="15" fill="#45627f">양의 무한대</text><rect x="300" y="440" width="255" height="48" rx="10" fill="#e6f1ff" stroke="#8bb8ef" stroke-width="2"/><text x="312" y="460" font-size="14">Number.POSITIVE_INFINITY</text><text x="312" y="480" font-size="16" font-weight="bold" fill="#0756ad">Infinity</text><circle cx="55" cy="540" r="20" fill="#1769d2"/><text x="55" y="547" font-size="21" font-weight="bold" fill="#fff" text-anchor="middle">5</text><text x="88" y="532" font-size="19" font-weight="bold">NEGATIVE_INFINITY</text><text x="88" y="556" font-size="15" fill="#45627f">음의 무한대</text><rect x="300" y="510" width="255" height="48" rx="10" fill="#e6f1ff" stroke="#8bb8ef" stroke-width="2"/><text x="312" y="530" font-size="14">Number.NEGATIVE_INFINITY</text><text x="312" y="550" font-size="16" font-weight="bold" fill="#0756ad">-Infinity</text>
</g>
<rect x="595" y="120" width="585" height="510" rx="18" fill="#fff" stroke="#a77be6" stroke-width="3"/>
<rect x="595" y="120" width="585" height="62" rx="16" fill="url(#purple)"/>
<text x="887" y="162" font-family="Arial" font-size="31" font-weight="bold" fill="#fff" text-anchor="middle">Number 객체의 메소드 (Method)</text>
<text x="887" y="210" font-family="Arial" font-size="20" fill="#49266f" text-anchor="middle">숫자 변환, 반올림, 비교 등의 기능을 수행합니다.</text>
<g font-family="Arial,sans-serif" font-size="17" fill="#25213b">
<rect x="612" y="235" width="550" height="42" rx="9" fill="#f1eaff"/><circle cx="635" cy="256" r="15" fill="#7744d9"/><text x="635" y="262" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">1</text><text x="660" y="262" font-weight="bold">toString()</text><text x="790" y="262" font-size="14">숫자를 문자열로 변환</text><text x="930" y="262" font-size="13" fill="#214f87">(123).toString()</text><text x="1100" y="262" font-size="14" font-weight="bold" fill="#c22">"123"</text><rect x="612" y="282" width="550" height="42" rx="9" fill="#f8f3ff"/><circle cx="635" cy="303" r="15" fill="#7744d9"/><text x="635" y="309" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">2</text><text x="660" y="309" font-weight="bold">toFixed(n)</text><text x="790" y="309" font-size="14">소수점 n자리까지 반올림</text><text x="930" y="309" font-size="13" fill="#214f87">(3.14159).toFixed(2)</text><text x="1100" y="309" font-size="14" font-weight="bold" fill="#c22">"3.14"</text><rect x="612" y="329" width="550" height="42" rx="9" fill="#f1eaff"/><circle cx="635" cy="350" r="15" fill="#7744d9"/><text x="635" y="356" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">3</text><text x="660" y="356" font-weight="bold">toExponential(n)</text><text x="790" y="356" font-size="14">지수 표기법으로 변환</text><text x="930" y="356" font-size="13" fill="#214f87">(12345).toExponential(2)</text><text x="1100" y="356" font-size="14" font-weight="bold" fill="#c22">"1.23e+4"</text><rect x="612" y="376" width="550" height="42" rx="9" fill="#f8f3ff"/><circle cx="635" cy="397" r="15" fill="#7744d9"/><text x="635" y="403" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">4</text><text x="660" y="403" font-weight="bold">toPrecision(n)</text><text x="790" y="403" font-size="14">유효숫자 n자리로 변환</text><text x="930" y="403" font-size="13" fill="#214f87">(123.456).toPrecision(4)</text><text x="1100" y="403" font-size="14" font-weight="bold" fill="#c22">"123.5"</text><rect x="612" y="423" width="550" height="42" rx="9" fill="#f1eaff"/><circle cx="635" cy="444" r="15" fill="#7744d9"/><text x="635" y="450" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">5</text><text x="660" y="450" font-weight="bold">valueOf()</text><text x="790" y="450" font-size="14">원시 숫자값 반환</text><text x="930" y="450" font-size="13" fill="#214f87">(new Number(10)).valueOf()</text><text x="1100" y="450" font-size="14" font-weight="bold" fill="#c22">10</text><rect x="612" y="470" width="550" height="42" rx="9" fill="#f8f3ff"/><circle cx="635" cy="491" r="15" fill="#7744d9"/><text x="635" y="497" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">6</text><text x="660" y="497" font-weight="bold">Number.isFinite()</text><text x="790" y="497" font-size="14">유한한 숫자인지 확인</text><text x="930" y="497" font-size="13" fill="#214f87">Number.isFinite(42)</text><text x="1100" y="497" font-size="14" font-weight="bold" fill="#c22">true</text><rect x="612" y="517" width="550" height="42" rx="9" fill="#f1eaff"/><circle cx="635" cy="538" r="15" fill="#7744d9"/><text x="635" y="544" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">7</text><text x="660" y="544" font-weight="bold">Number.isNaN()</text><text x="790" y="544" font-size="14">NaN인지 확인</text><text x="930" y="544" font-size="13" fill="#214f87">Number.isNaN(NaN)</text><text x="1100" y="544" font-size="14" font-weight="bold" fill="#c22">true</text><rect x="612" y="564" width="550" height="42" rx="9" fill="#f8f3ff"/><circle cx="635" cy="585" r="15" fill="#7744d9"/><text x="635" y="591" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">8</text><text x="660" y="591" font-weight="bold">Number.isInteger()</text><text x="790" y="591" font-size="14">정수인지 확인</text><text x="930" y="591" font-size="13" fill="#214f87">Number.isInteger(10.0)</text><text x="1100" y="591" font-size="14" font-weight="bold" fill="#c22">true</text>
</g>
<rect x="20" y="655" width="1160" height="145" rx="18" fill="#e9f7e9" stroke="#50ad61" stroke-width="3"/>
<rect x="20" y="655" width="1160" height="48" rx="15" fill="#188444"/>
<text x="600" y="688" font-family="Arial" font-size="27" font-weight="bold" fill="#fff" text-anchor="middle">핵심 개념과 실생활 활용</text>
<g font-family="Arial" font-size="20" fill="#183b2a" text-anchor="middle">
<text x="210" y="741" font-weight="bold">속성: Number.MAX_VALUE</text><text x="210" y="773">숫자의 범위와 특수값 확인</text>
<text x="600" y="741" font-weight="bold">메소드: toFixed(2)</text><text x="600" y="773">소수점 둘째 자리까지 반올림</text>
<text x="990" y="741" font-weight="bold">메소드: Number.isInteger()</text><text x="990" y="773">정수 여부 판별</text>
</g></svg>