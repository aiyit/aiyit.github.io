<!DOCTYPE html>
<html>
<head>
    <title>예제8-7 변수</title>
</head>
<body>
    <h3>JavaScript 변수선언</h3>
    
    <script>
        // 1. 변수 선언, 초기화 및 기본 연산
        var x = 5, y = 6, z;    // 변수 x, y, z 선언 및 초기화 (z는 undefined 상태)
        z = x + y;              // x와 y의 합(11)을 변수 z에 대입
        document.write("x+y=", z +"<br/>"); // 연산 결과 출력 및 줄바꿈

        // 2. 변수 식별자(이름) 작성 규칙
        // - 변수명은 영문자, 숫자, $, _(밑줄) 조합으로 생성 가능
        // - 특수문자는 $, _ 만 허용됨
        var $$, _x4, x123, xyz;
        $$ = 3; _x4 = 4; x123 = 5; xyz = 6;
        document.write($$+" $사용   "+_x4+" _밑줄사용  " + x123 + " x123   "+xyz+"<br/>");

        // 3. 변수명 사용 불가 규칙
        // - 숫자로 시작하는 변수명(예: 1x3y) 사용 불가
        // - 자바스크립트 예약어(예: break, var, function 등) 사용 불가
        document.write("예약어는 사용할 수 없음: var break=5; 1x3y=6 ;<br/>"); 
    </script>	

    <h2>JavaScript var / let / const</h2>
    
    <script>
        // 4. var 키워드 특징
        // - 함수 스코프(Function Scope)를 가짐
        // - 동일한 변수명으로 '재선언'과 '재할당'이 모두 가능 (주의 필요)
        var a = 10;
        var a = 20; // 재선언 가능 (기존 변수 a를 덮어씀)
        document.write("var a = " + a + "<br/>"); // 20 출력

        // 5. let 키워드 특징
        // - 블록 스코프(Block Scope)를 가짐
        // - '재선언'은 불가하며, '재할당'만 가능
        let b = 30;
        b = 40; // 재할당 가능
        document.write("let b = " + b + "<br/>"); // 40 출력
        // let b = 50; // SyntaxError: Identifier 'b' has already been declared (재선언 불가 오류)

        // 6. const 키워드 특징
        // - 블록 스코프(Block Scope)를 가짐
        // - '재선언'과 '재할당' 모두 불가능 (상수 선언 시 사용)
        const c = 60;
        document.write("const c = " + c + "<br/>"); // 60 출력
        // c = 70; // TypeError: Assignment to constant variable. (재할당 불가 오류)

        // 7. const와 객체(Object) 참조의 특징
        // - const로 선언된 객체 자체의 참조(주소)는 변경할 수 없으나,
        //   객체 내부 속성(property)의 값은 변경할 수 있음
        const obj = { name: "AI" };
        obj.name = "Copilot"; // 객체 내부 속성값 변경 (성공)
        document.write("const obj.name = " + obj.name + "<br/>"); // Copilot 출력
    </script>
</body>
</html>
