<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>onclick 이벤트 예제</title>
</head>
<body>
    <h1>onclick 이벤트</h1>
    <input type="number" id="num1" value="5"> + 
    <input type="number" id="num2" value="6">
    <button onclick="runAdd()">계산 실행</button>

    <p id="first"></p>

    <script>
        function jsFunction(a1, a2) {
            return a1 + a2;
        }

        function runAdd() {
            var n1 = Number(document.getElementById("num1").value);
            var n2 = Number(document.getElementById("num2").value);
            var result = jsFunction(n1, n2);
            document.getElementById("first").innerHTML = "결과: " + result;
        }
    </script>
</body>
</html>
