<!DOCTYPE html>
<html>
<head>
    <title>예제8-8연산자</title>
</head>
<!-- JavaScript 연산자 요약
1. 산술 연산자   + 더하기, - 빼기, * 곱하기, / 나누기   ** 제곱, % 나머지, ++ 증가, -- 감소
2. 대입 연산자   = 기본 대입   += 더하기 대입, %= 나머지 대입, *= 곱하기 대입
3. 문자열 연산   + 문자열 연결 (문자+문자, 문자+숫자)
4. 비교 연산자   == 값 비교, === 값+타입 비교   != 같지 않음, > 크다, < 작다
5. 논리 연산자   && AND, || OR, ! NOT
-->
<body>
    <h3>javaScript 연산자</h3>
    
    <script>
        // 1. 산술 연산자
        document.write("<b>-- 산술연산자 --</b><br/>");
        
        var x = 10, y = 6;      // 변수 x, y 값 대입
        var z = x + y;          // 더하기 연산자(+)를 통해 변수 z에 x+y 값을 대입
        document.write("더하기 연산자: x=" + x + " + y=" + y + " = " + z + "<br/>"); // 결과 출력
        
        var a, b, c;     
        a = x - y;              // 빼기 연산자 (-)
        b = x * y;              // 곱하기 연산자 (*)
        c = x / y;              // 나누기 연산자 (/)
        document.write("빼기 연산자: - (" + a + ") | X 연산자: * (" + b + ") | 나누기 연산자: / (" + c + ")<br/>");
        
        a = x ** 2;             // 제곱 연산자 (**)
        b = x % y;              // 나머지 연산자 (%)
        c = x++;                // 증감 연산자 (후위 증가)
        z = z--;                // 증감 연산자 (후위 감소)
        document.write("제곱 연산자: ** (" + a + ") | 나머지 연산자: % (" + b + ") | 증감연산자: ++, -- (" + c + ", " + z + ")<br/><br/>");

        // 2. 대입 연산자
        document.write("<b>-- 대입연산자 --</b><br/>");
        
        a += 5; 
        b %= 5; 
        c *= 5;        
        document.write("더하기대입: += (" + a + ") | 나머지대입: %= (" + b + ") | 곱하기대입: *= (" + c + ")<br/><br/>");

        // 3. 문자열 연산
        document.write("<b>-- 문자열 연산 --</b><br/>");
        
        var txt1 = "AI", txt2 = " Software";
        document.write("문자1 + 문자2: " + txt1 + txt2 + "<br/><br/>");

        // 4. 비교 연산자
        document.write("<b>-- 비교연산자 --</b><br/>");
        document.write("사용 가능한 연산자: ==, ===, !=, >, <<br/><br/>");

        // 5. 논리 연산자
        document.write("<b>-- 논리연산자 --</b><br/>");
        document.write("사용 가능한 연산자: &&, ||, !<br/>");
    </script>
    <h3><a href="8-8example.html">버튼함수를 이용한 오퍼레이션</a></h3>
</body>
</html>
