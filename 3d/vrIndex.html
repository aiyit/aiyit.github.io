<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Cardboard VR 테스트 - 나비 정원 (Butterfly Garden)</title>
<link rel="stylesheet" href="style.css" />

<!-- three.js는 core만 사용 (StereoCamera는 core에 포함되어 있어 examples 의존 없이 스테레오 구현 가능) -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
</head>
<body>
  <div id="app">
    <canvas id="scene-canvas"></canvas>

    <div id="overlay">
      <div id="loading">3D 콘텐츠 불러오는 중...</div>

      <div id="hud"> // class="hidden">
        <p class="hint pc-hint">화면을 클릭하면 마우스 시점 이동이 활성화됩니다 · WASD로 이동</p>
        <p class="hint vr-hint hidden">기기를 움직여 주변의 나비와 숲을 둘러보세요</p>
      </div>
<p>check1  </p>
      <button id="vr-button" class="hidden">📱 VR 모드 (Cardboard)</button>
      <button id="exit-vr-button" class="hidden">✕ VR 종료</button>
<p>check2  </p>
      <div id="orientation-warning" class="hidden">
        VR 모드는 기기를 가로로 돌려주세요 📱↔️
      </div>
    </div>
  </div>
<p>check3  </p>
  <script type="module" src="main.js"></script>
  <p>check4  </p>
</body>
</html>
