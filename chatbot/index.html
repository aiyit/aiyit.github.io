<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI소프트웨어과 AI 상담원</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="chat-page">
    <section class="chat-card" aria-label="AI소프트웨어과 AI 상담원">
      <header class="chat-header">
        <div class="bot-avatar">AI</div>
        <div>
          <h1>AI소프트웨어과 AI 상담원</h1>
          <p>여주대학교 AI소프트웨어과 홈페이지 안내</p>
        </div>
      </header>

      <div id="quickButtons" class="quick-buttons">
        <button data-question="AI소프트웨어과는 어떤 학과인가요?">🎓 학과 소개</button>
        <button data-question="AI소프트웨어과에서 무엇을 배우나요?">📚 교육과정</button>
        <button data-question="졸업 후 진로는 어떻게 되나요?">💼 졸업 후 진로</button>
        <button data-question="입학 관련 정보를 알려주세요.">📝 입학 안내</button>
      </div>

      <div id="chatMessages" class="messages" aria-live="polite"></div>

      <form id="chatForm" class="input-area">
        <textarea id="messageInput" rows="1" maxlength="2000"
          placeholder="궁금한 내용을 입력하세요. 예: Python을 배우나요?" required></textarea>
        <button id="sendButton" type="submit">전송</button>
      </form>

      <p class="notice">※ 학과 공식 자료에 없는 내용은 확인이 필요하다고 안내합니다.</p>
    </section>
  </main>
  <script src="./chatbot.js"></script>
</body>
</html>
