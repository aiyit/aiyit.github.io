<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>전기기능사 필기 모의고사</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--bg:#eaf1f4;--ink:#10303d;--sub:#4b6672;--card:#fff;--line:#c5d5dc;--acc:#0b7a86;--sig:#f2b705;--ok:#1d8a4b;--bad:#c0392b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1d24;--ink:#e4eef2;--sub:#9db3bd;--card:#162830;--line:#2b424d;--acc:#4cc3cf;--sig:#f2c53a;--ok:#4cc07f;--bad:#ff8a7a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1d24;--ink:#e4eef2;--sub:#9db3bd;--card:#162830;--line:#2b424d;--acc:#4cc3cf;--sig:#f2c53a;--ok:#4cc07f;--bad:#ff8a7a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.7 "Noto Sans KR",system-ui,sans-serif;
background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:28px 28px;background-attachment:fixed}
main{max-width:720px;margin:0 auto;padding:20px 16px 56px}
h1{font:400 clamp(30px,8vw,44px)/1.2 "Black Han Sans","Noto Sans KR",sans-serif;margin:8px 0 6px}
h2{font:700 20px/1.4 "Noto Sans KR",sans-serif;margin:0 0 10px}
.lead{color:var(--sub);margin:0 0 16px}
.box{background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:18px;margin-bottom:14px}
.modes{display:grid;gap:10px}
.mode{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:14px;color:var(--ink);font:700 17px "Noto Sans KR",sans-serif;cursor:pointer;min-height:64px}
.mode small{display:block;font:400 13px "Noto Sans KR",sans-serif;color:var(--sub)}
.mode:hover{border-color:var(--acc)}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:8px}
#tm{background:var(--ink);color:var(--bg);padding:2px 12px;border-radius:99px}
#tm.low{background:var(--bad);color:#fff}
.bar{height:6px;background:var(--line);border-radius:3px;margin-bottom:14px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc)}
.tag{display:inline-block;background:var(--sig);color:#10303d;font-weight:700;font-size:13px;padding:1px 10px;border-radius:99px;margin-bottom:8px}
.q{font-weight:700;font-size:17px;margin:0 0 10px}
.o{display:block;width:100%;text-align:left;margin:8px 0;padding:11px 12px;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font:400 16px "Noto Sans KR",sans-serif;cursor:pointer;min-height:46px}
.o.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent)}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:12px 0}
.grid button{border:2px solid var(--line);background:var(--card);color:var(--sub);border-radius:6px;min-height:34px;font:700 12px "Noto Sans KR",sans-serif;cursor:pointer;padding:0}
.grid button.ans{background:var(--acc);border-color:var(--acc);color:#fff}
.grid button.cur{border-color:var(--sig);outline:2px solid var(--sig)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:12px}
.btn{border:0;border-radius:8px;padding:12px 18px;font:700 16px "Noto Sans KR",sans-serif;cursor:pointer;min-height:48px;background:var(--acc);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.score{font:400 56px/1.1 "Black Han Sans","Noto Sans KR",sans-serif;color:var(--acc)}
.pass{display:inline-block;padding:2px 14px;border-radius:99px;font-weight:700;color:#fff;background:var(--ok)}
.pass.fail{background:var(--bad)}
.rev{border-left:6px solid var(--bad);background:var(--card);border-radius:0 8px 8px 0;padding:10px 14px;margin:10px 0;font-size:15px}
.rev b{display:block}
.rev small{color:var(--sub)}
.hide{display:none}
a{color:var(--acc)}
button:focus-visible{outline:3px solid var(--sig);outline-offset:2px}
</style>
</head>
<body>
<main>
<h1>모의고사</h1>
<p class="lead"><a href="elecExam.html">← 목록으로</a></p>

<div id="start">
<p class="lead">단원 퀴즈 190문항에서 무작위로 출제한다. 보기 순서도 매번 바뀐다.</p>
<div class="modes" id="modes"></div>
</div>

<div id="exam" class="hide">
<div class="top"><span id="no"></span><span id="tm"></span></div>
<div class="bar"><i id="bar"></i></div>
<div class="box"><span class="tag" id="tag"></span><p class="q" id="qt"></p><div id="opts"></div></div>
<div class="grid" id="grid"></div>
<div class="nav"><button class="btn ghost" id="prev" type="button">이전</button><button class="btn ghost" id="next" type="button">다음</button><button class="btn" id="submit" type="button">제출</button></div>
<p id="msg" class="lead" style="margin-top:10px"></p>
</div>

<div id="result" class="hide">
<div class="box"><div class="score" id="sc"></div><p><span class="pass" id="pf"></span></p><div id="bysub"></div><p id="weak" class="lead"></p></div>
<h2>틀린 문제</h2><div id="rev"></div>
<div class="nav"><button class="btn" id="again" type="button">다시 보기</button><a class="btn ghost" href="elecWrong.html" style="text-decoration:none;display:inline-flex;align-items:center">오답노트</a></div>
</div>
</main>
<script>
const BANK=[{"s": 0, "u": "1. 옴의 법칙", "q": "저항 10Ω에 100V를 가했을 때 흐르는 전류는?", "o": ["1A", "10A", "100A", "1000A"], "a": 1, "e": "I = V ÷ R = 100 ÷ 10 = 10A"}, {"s": 0, "u": "1. 옴의 법칙", "q": "전압 200V, 전류 4A일 때 저항은?", "o": ["20Ω", "40Ω", "50Ω", "800Ω"], "a": 2, "e": "R = V ÷ I = 200 ÷ 4 = 50Ω"}, {"s": 0, "u": "1. 옴의 법칙", "q": "4Ω과 6Ω을 직렬로 연결한 합성저항은?", "o": ["2.4Ω", "5Ω", "10Ω", "24Ω"], "a": 2, "e": "직렬은 합이다. 4 + 6 = 10Ω"}, {"s": 0, "u": "1. 옴의 법칙", "q": "6Ω과 3Ω을 병렬로 연결한 합성저항은?", "o": ["2Ω", "4.5Ω", "9Ω", "18Ω"], "a": 0, "e": "(6×3) ÷ (6+3) = 18 ÷ 9 = 2Ω"}, {"s": 0, "u": "1. 옴의 법칙", "q": "100V 전원에 5A가 흐를 때 전력은?", "o": ["20W", "105W", "500W", "2000W"], "a": 2, "e": "P = V × I = 100 × 5 = 500W"}, {"s": 0, "u": "1. 옴의 법칙", "q": "전압 24V, 저항 8Ω일 때 흐르는 전류는?", "o": ["0.33A", "3A", "24A", "192A"], "a": 1, "e": "I = V ÷ R = 24 ÷ 8 = 3A"}, {"s": 0, "u": "1. 옴의 법칙", "q": "전류 5A가 흐르는 20Ω 저항 양단의 전압은?", "o": ["4V", "25V", "100V", "400V"], "a": 2, "e": "V = I × R = 5 × 20 = 100V"}, {"s": 0, "u": "1. 옴의 법칙", "q": "6Ω 저항 3개를 직렬로 연결한 합성저항은?", "o": ["2Ω", "6Ω", "12Ω", "18Ω"], "a": 3, "e": "직렬은 합이다. 6 × 3 = 18Ω"}, {"s": 0, "u": "1. 옴의 법칙", "q": "6Ω 저항 3개를 병렬로 연결한 합성저항은?", "o": ["2Ω", "6Ω", "12Ω", "18Ω"], "a": 0, "e": "같은 저항 n개 병렬은 R ÷ n = 6 ÷ 3 = 2Ω"}, {"s": 0, "u": "1. 옴의 법칙", "q": "10Ω 저항에 2A가 흐를 때 소비 전력은?", "o": ["20W", "40W", "80W", "200W"], "a": 1, "e": "P = I²R = 4 × 10 = 40W"}, {"s": 0, "u": "2. 직류 회로와 키르히호프 법칙", "q": "접속점에 3A와 2A가 흘러 들어온다. 나가는 전류는?", "o": ["1A", "3A", "5A", "6A"], "a": 2, "e": "제1법칙: 유입 합 = 유출 합 = 3 + 2 = 5A"}, {"s": 0, "u": "2. 직류 회로와 키르히호프 법칙", "q": "12V 전원에 2Ω과 4Ω을 직렬 연결했다. 4Ω에 걸리는 전압은?", "o": ["4V", "6V", "8V", "12V"], "a": 2, "e": "V₂ = 12 × 4 ÷ (2+4) = 8V"}, {"s": 0, "u": "2. 직류 회로와 키르히호프 법칙", "q": "3Ω과 6Ω이 병렬이고 전체 전류가 9A이다. 3Ω에 흐르는 전류는?", "o": ["3A", "4.5A", "6A", "9A"], "a": 2, "e": "I₁ = 9 × 6 ÷ (3+6) = 6A"}, {"s": 0, "u": "2. 직류 회로와 키르히호프 법칙", "q": "1.5V 전지 4개를 직렬로 연결한 기전력은?", "o": ["1.5V", "3V", "6V", "9V"], "a": 2, "e": "직렬은 기전력의 합이다. 1.5 × 4 = 6V"}, {"s": 0, "u": "2. 직류 회로와 키르히호프 법칙", "q": "키르히호프 제2법칙의 내용은?", "o": ["유입 전류 합 = 유출 전류 합", "폐회로에서 기전력 합 = 전압강하 합", "전압은 저항에 반비례", "저항은 전류에 비례"], "a": 1, "e": "제2법칙은 전압에 관한 법칙이다. 폐회로의 기전력 합 = 전압강하 합"}, {"s": 0, "u": "2. 직류 회로와 키르히호프 법칙", "q": "접속점에 4A와 3A가 들어오고 한 가닥으로 2A가 나간다. 나머지 가닥의 유출 전류는?", "o": ["1A", "2A", "5A", "9A"], "a": 2, "e": "유입 7A = 유출 합이므로 나머지는 7 − 2 = 5A"}, {"s": 0, "u": "2. 직류 회로와 키르히호프 법칙", "q": "30V 전원에 10Ω과 20Ω을 직렬로 연결했을 때 전류는?", "o": ["0.5A", "1A", "1.5A", "3A"], "a": 1, "e": "I = 30 ÷ (10+20) = 1A"}, {"s": 0, "u": "2. 직류 회로와 키르히호프 법칙", "q": "4Ω과 12Ω이 병렬이고 전체 전류가 16A이다. 12Ω에 흐르는 전류는?", "o": ["4A", "8A", "12A", "16A"], "a": 0, "e": "I₂ = 16 × 4 ÷ (4+12) = 4A"}, {"s": 0, "u": "2. 직류 회로와 키르히호프 법칙", "q": "1.5V 전지 3개를 병렬로 연결한 기전력은?", "o": ["0.5V", "1.5V", "3V", "4.5V"], "a": 1, "e": "병렬은 기전력이 그대로 1.5V이다"}, {"s": 0, "u": "2. 직류 회로와 키르히호프 법칙", "q": "휘트스톤 브리지가 평형일 때 검류계에 흐르는 전류는?", "o": ["0", "무한대", "최대", "전원 전류와 같다"], "a": 0, "e": "평형이면 검류계 양단 전위가 같아 전류가 0이다"}, {"s": 0, "u": "3. 정전기와 콘덴서", "q": "C = 10μF에 100V를 가했을 때 저장되는 전하량은?", "o": ["0.1mC", "1mC", "10mC", "100mC"], "a": 1, "e": "Q = CV = 10×10⁻⁶ × 100 = 10⁻³C = 1mC"}, {"s": 0, "u": "3. 정전기와 콘덴서", "q": "10μF과 20μF을 병렬 연결한 합성 정전용량은?", "o": ["6.7μF", "15μF", "30μF", "200μF"], "a": 2, "e": "병렬은 합이다. 10 + 20 = 30μF"}, {"s": 0, "u": "3. 정전기와 콘덴서", "q": "4μF 콘덴서 2개를 직렬 연결한 합성 정전용량은?", "o": ["1μF", "2μF", "4μF", "8μF"], "a": 1, "e": "(4×4) ÷ (4+4) = 2μF"}, {"s": 0, "u": "3. 정전기와 콘덴서", "q": "두 점전하 사이의 거리를 2배로 하면 쿨롱의 힘은?", "o": ["½배", "¼배", "2배", "4배"], "a": 1, "e": "힘은 거리의 제곱에 반비례하므로 ¼배가 된다"}, {"s": 0, "u": "3. 정전기와 콘덴서", "q": "2μF 콘덴서에 100V를 가했을 때 정전에너지는?", "o": ["0.01J", "0.02J", "0.1J", "1J"], "a": 0, "e": "W = ½CV² = ½ × 2×10⁻⁶ × 100² = 0.01J"}, {"s": 0, "u": "3. 정전기와 콘덴서", "q": "Q = 4μC, C = 2μF인 콘덴서의 전압은?", "o": ["0.5V", "2V", "8V", "16V"], "a": 1, "e": "V = Q ÷ C = 4 ÷ 2 = 2V"}, {"s": 0, "u": "3. 정전기와 콘덴서", "q": "3μF 콘덴서 3개를 병렬로 연결한 합성 정전용량은?", "o": ["1μF", "3μF", "6μF", "9μF"], "a": 3, "e": "병렬은 합이다. 3 × 3 = 9μF"}, {"s": 0, "u": "3. 정전기와 콘덴서", "q": "콘덴서를 직렬로 연결했을 때 각 콘덴서에 모인 전하량은?", "o": ["각각 다르다", "모두 같다", "용량에 비례", "용량에 반비례"], "a": 1, "e": "직렬에서는 전하량이 모두 같고 전압이 나뉜다"}, {"s": 0, "u": "3. 정전기와 콘덴서", "q": "콘덴서를 병렬로 연결했을 때 각 콘덴서에 걸리는 전압은?", "o": ["모두 같다", "용량에 비례", "용량에 반비례", "0이다"], "a": 0, "e": "병렬에서는 전압이 모두 같다"}, {"s": 0, "u": "3. 정전기와 콘덴서", "q": "정전용량의 단위는?", "o": ["헨리(H)", "패럿(F)", "웨버(Wb)", "암페어(A)"], "a": 1, "e": "정전용량의 단위는 패럿(F)이다"}, {"s": 0, "u": "4. 자기와 전자유도", "q": "전동기의 회전 원리에 해당하는 법칙은?", "o": ["플레밍 오른손 법칙", "플레밍 왼손 법칙", "렌츠의 법칙", "쿨롱의 법칙"], "a": 1, "e": "도체에 힘이 작용하는 전동기는 플레밍 왼손 법칙"}, {"s": 0, "u": "4. 자기와 전자유도", "q": "B = 2T인 자기장에 길이 0.5m 도체가 직각으로 있고 10A가 흐른다. 힘은?", "o": ["5N", "10N", "20N", "100N"], "a": 1, "e": "F = BIl = 2 × 10 × 0.5 = 10N"}, {"s": 0, "u": "4. 자기와 전자유도", "q": "유도기전력이 자속의 변화를 방해하는 방향으로 생긴다는 법칙은?", "o": ["패러데이 법칙", "렌츠의 법칙", "키르히호프 법칙", "옴의 법칙"], "a": 1, "e": "방향에 관한 법칙은 렌츠의 법칙이다"}, {"s": 0, "u": "4. 자기와 전자유도", "q": "권수 100회 코일에서 0.1초 동안 자속이 0.05Wb 변했다. 유도기전력은?", "o": ["5V", "10V", "50V", "500V"], "a": 2, "e": "e = N × ΔΦ ÷ Δt = 100 × 0.05 ÷ 0.1 = 50V"}, {"s": 0, "u": "4. 자기와 전자유도", "q": "L = 4H인 코일에 5A가 흐를 때 저장 에너지는?", "o": ["10J", "20J", "50J", "100J"], "a": 2, "e": "W = ½LI² = ½ × 4 × 25 = 50J"}, {"s": 0, "u": "4. 자기와 전자유도", "q": "인덕턴스의 단위는?", "o": ["패럿(F)", "헨리(H)", "옴(Ω)", "테슬라(T)"], "a": 1, "e": "인덕턴스의 단위는 헨리(H)이다"}, {"s": 0, "u": "4. 자기와 전자유도", "q": "자속의 단위는?", "o": ["테슬라(T)", "웨버(Wb)", "헨리(H)", "암페어턴(AT)"], "a": 1, "e": "자속은 웨버(Wb), 자속밀도는 테슬라(T)이다"}, {"s": 0, "u": "4. 자기와 전자유도", "q": "같은 극끼리 마주 보면 자석 사이에 작용하는 힘은?", "o": ["흡인력", "반발력", "없다", "회전력"], "a": 1, "e": "같은 극은 반발하고 다른 극은 끌어당긴다"}, {"s": 0, "u": "4. 자기와 전자유도", "q": "L = 2H인 코일의 전류가 0.5초 동안 4A 변할 때 유도기전력은?", "o": ["4V", "8V", "16V", "32V"], "a": 2, "e": "e = L × ΔI ÷ Δt = 2 × 4 ÷ 0.5 = 16V"}, {"s": 0, "u": "4. 자기와 전자유도", "q": "강자성체에 해당하는 것은?", "o": ["구리", "철", "알루미늄", "은"], "a": 1, "e": "철, 니켈, 코발트가 강자성체이다"}, {"s": 0, "u": "5. 교류 기초", "q": "60Hz 교류의 주기는?", "o": ["6ms", "16.7ms", : 3, "e": "가연성 분진 장소는 관·케이블공사를 하며 애자사용공사는 쓰지 않는다"}, {"s": 2, "u": "18. 특수장소와 전기 안전", "q": "감전으로 호흡이 멈춘 사람을 구조한 뒤 해야 할 조치는?", "o": ["물을 먹인다", "인공호흡·심폐소생술", "그대로 눕혀 둔다", "몸을 흔든다"], "a": 1, "e": "즉시 인공호흡과 심폐소생술을 하고 119에 연락한다"}, {"s": 2, "u": "18. 특수장소와 전기 안전", "q": "정전기로 인한 화재를 막는 방법은?", "o": ["가습을 금지한다", "도체를 접지하고 습도를 유지한다", "절연을 줄인다", "전압을 올린다"], "a": 1, "e": "접지와 적정 습도 유지로 정전기 축적을 막는다"}, {"s": 2, "u": "19. KEC 핵심 규정", "q": "KEC에서 교류 저압의 범위는?", "o": ["600V 이하", "1000V 이하", "1500V 이하", "7000V 이하"], "a": 1, "e": "교류 1000V 이하, 직류 1500V 이하가 저압이다"}, {"s": 2, "u": "19. KEC 핵심 규정", "q": "KEC에서 고압의 범위는?", "o": ["저압 초과 7kV 이하", "1kV 초과 20kV 이하", "7kV 초과", "35kV 이하"], "a": 0, "e": "저압을 넘고 7kV 이하가 고압이다"}, {"s": 2, "u": "19. KEC 핵심 규정", "q": "3상 회로에서 L1 상 도체의 색상은?", "o": ["갈색", "흑색", "회색", "청색"], "a": 0, "e": "L1은 갈색, L2는 흑색, L3는 회색이다"}, {"s": 2, "u": "19. KEC 핵심 규정", "q": "중성선(N)의 색상은?", "o": ["흑색", "회색", "청색", "녹색-노란색"], "a": 2, "e": "중성선은 청색이다"}, {"s": 2, "u": "19. KEC 핵심 규정", "q": "사용전압 400V인 저압 전로의 절연저항은?", "o": ["0.1MΩ 이상", "0.5MΩ 이상", "1.0MΩ 이상", "10MΩ 이상"], "a": 2, "e": "500V 이하(FELV 포함)는 1.0MΩ 이상이다"}, {"s": 2, "u": "19. KEC 핵심 규정", "q": "KEC에서 직류 저압의 범위는?", "o": ["600V 이하", "1000V 이하", "1500V 이하", "7000V 이하"], "a": 2, "e": "직류는 1500V 이하가 저압이다"}, {"s": 2, "u": "19. KEC 핵심 규정", "q": "KEC에서 특고압의 범위는?", "o": ["1kV 초과", "7kV 초과", "20kV 초과", "100kV 초과"], "a": 1, "e": "7kV를 초과하면 특고압이다"}, {"s": 2, "u": "19. KEC 핵심 규정", "q": "3상 회로에서 L2 상 도체의 색상은?", "o": ["갈색", "흑색", "회색", "청색"], "a": 1, "e": "L2는 흑색이다"}, {"s": 2, "u": "19. KEC 핵심 규정", "q": "3상 회로에서 L3 상 도체의 색상은?", "o": ["갈색", "흑색", "회색", "청색"], "a": 2, "e": "L3는 회색이다"}, {"s": 2, "u": "19. KEC 핵심 규정", "q": "보호도체(PE)의 색상은?", "o": ["갈색", "청색", "녹색-노란색", "흑색"], "a": 2, "e": "보호도체는 녹색-노란색이다"}];
const SUBJ=["전기이론","전기기기","전기설비"];
const MODES=[["전과목 모의고사","60문항 · 60분 · 합격 60점 이상",3,60],["전기이론","20문항 · 20분",0,20],["전기기기","20문항 · 20분",1,20],["전기설비","20문항 · 20분",2,20]];
const $=id=>document.getElementById(id);
function saveWrong(r){try{const st=JSON.parse(localStorage.getItem("elecWQ")||"[]");const f=st.find(x=>x.q===r.q);if(f){f.n=(f.n||1)+1;f.t=Date.now()}else{st.push({...r,n:1,t:Date.now()})}localStorage.setItem("elecWQ",JSON.stringify(st))}catch(e){}}
let list=[],ans=[],cur=0,left=0,timer=null,mode=0,warned=false;
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
MODES.forEach((m,i)=>{const b=document.createElement("button");b.type="button";b.className="mode";
 const d=document.createElement("div");d.textContent=m[0];const s=document.createElement("small");s.textContent=m[1];d.appendChild(s);
 b.appendChild(d);b.onclick=()=>begin(i);$("modes").appendChild(b)});
function begin(m){
 mode=m;const sel=MODES[m][2];
 if(sel===3){list=[0,1,2].flatMap(s=>shuf(BANK.filter(b=>b.s===s)).slice(0,20))}
 else list=shuf(BANK.filter(b=>b.s===sel)).slice(0,20);
 list=list.map(b=>{const idx=shuf([0,1,2,3]);return{...b,opts:idx.map(i=>b.o[i]),ci:idx.indexOf(b.a)}});
 ans=list.map(()=>-1);cur=0;warned=false;left=MODES[m][3]*60;
 $("start").classList.add("hide");$("result").classList.add("hide");$("exam").classList.remove("hide");
 clearInterval(timer);timer=setInterval(tick,1000);tick(true);draw();
}
function tick(first){
 if(!first)left--;
 const mm=String(Math.floor(left/60)).padStart(2,"0"),ss=String(left%60).padStart(2,"0");
 $("tm").textContent=mm+":"+ss;$("tm").className=left<=300?"low":"";
 if(left<=0)finish();
}
function draw(){
 const q=list[cur];
 $("no").textContent=(cur+1)+" / "+list.length;
 $("bar").style.width=((cur+1)/list.length*100)+"%";
 $("tag").textContent=SUBJ[q.s];$("qt").textContent=(cur+1)+". "+q.q;
 const o=$("opts");o.innerHTML="";
 q.opts.forEach((t,i)=>{const b=document.createElement("button");b.type="button";b.className="o"+(ans[cur]===i?" sel":"");
  b.textContent=(i+1)+") "+t;b.onclick=()=>{ans[cur]=i;warned=false;$("msg").textContent="";draw()};o.appendChild(b)});
 const g=$("grid");g.innerHTML="";
 list.forEach((_,i)=>{const b=document.createElement("button");b.type="button";b.textContent=i+1;
  b.className=(ans[i]>=0?"ans ":"")+(i===cur?"cur":"");b.onclick=()=>{cur=i;draw()};g.appendChild(b)});
 $("prev").disabled=cur===0;$("next").disabled=cur===list.length-1;
}
$("prev").onclick=()=>{cur--;draw()};$("next").onclick=()=>{cur++;draw()};
$("submit").onclick=()=>{
 const un=ans.filter(a=>a<0).length;
 if(un>0&&!warned){warned=true;$("msg").textContent="풀지 않은 문제가 "+un+"개 있다. 제출하려면 한 번 더 누른다.";return}
 finish();
};
function finish(){
 clearInterval(timer);
 $("exam").classList.add("hide");$("result").classList.remove("hide");
 const ok=list.map((q,i)=>ans[i]===q.ci);
 const n=ok.filter(Boolean).length,total=Math.round(n/list.length*100);
 $("sc").textContent=total+"점";
 const pf=$("pf");pf.textContent=total>=60?"합격 기준 통과":"합격 기준 미달 (60점 이상)";pf.className="pass"+(total>=60?"":" fail");
 const by=$("bysub");by.innerHTML="";
 [0,1,2].forEach(s=>{const idx=list.map((q,i)=>q.s===s?i:-1).filter(i=>i>=0);if(!idx.length)return;
  const c=idx.filter(i=>ok[i]).length;const p=document.createElement("p");p.style.margin="4px 0";
  p.textContent=SUBJ[s]+": "+c+" / "+idx.length+" ("+Math.round(c/idx.length*100)+"점)";by.appendChild(p)});
 const wrong={};list.forEach((q,i)=>{if(!ok[i])wrong[q.u]=(wrong[q.u]||0)+1});
 const top=Object.entries(wrong).sort((a,b)=>b[1]-a[1]).slice(0,3).map(e=>e[0]);
 $("weak").textContent=top.length?"복습 추천 단원: "+top.join(", "):"모두 맞혔다. 잘했다.";
 list.forEach((q,i)=>{if(!ok[i])saveWrong({u:q.u,q:q.q,o:q.o,a:q.a,e:q.e})});
 const rv=$("rev");rv.innerHTML="";
 list.forEach((q,i)=>{if(ok[i])return;
  const d=document.createElement("div");d.className="rev";
  const b=document.createElement("b");b.textContent=(i+1)+". "+q.q;d.appendChild(b);
  const t=document.createElement("div");t.textContent="내 답: "+(ans[i]>=0?q.opts[ans[i]]:"무응답")+" / 정답: "+q.opts[q.ci];d.appendChild(t);
  const e=document.createElement("small");e.textContent="해설: "+q.e+" ("+q.u+")";d.appendChild(e);rv.appendChild(d)});
 if(!rv.children.length){rv.textContent="틀린 문제가 없다."}
}
$("again").onclick=()=>{$("result").classList.add("hide");$("start").classList.remove("hide");scrollTo({top:0})};
</script>
