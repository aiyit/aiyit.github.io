<!DOCTYPE html> <!-- HTML5 문서임을 브라우저에 알리는 선언 -->
<html> <!-- HTML 문서의 시작 -->
<head> <!-- 문서의 기본 정보를 작성하는 영역 -->
    <meta charset="UTF-8"> <!-- 한글이 깨지지 않도록 문자 인코딩을 UTF-8로 설정 -->
    <title>회원가입 문자열 검사</title> <!-- 브라우저 탭에 표시할 문서 제목 -->
</head> <!-- 기본 정보 영역 끝 -->
<body> <!-- 실제 화면에 표시할 내용을 작성하는 영역 -->

<h2>회원가입 시스템</h2> <!-- 두 번째 크기의 제목을 화면에 출력 -->

<!-- 이름을 입력받는 입력창: id="name"은 JavaScript에서 이 입력창을 찾기 위한 이름 -->
이름 : <input type="text" id="name" placeholder="이름 입력"><br><br> <!-- text는 문자 입력창, placeholder는 입력 전 안내 문구, br은 줄바꿈 -->

<!-- 이메일을 입력받는 입력창 -->
이메일 : <input type="text" id="email" placeholder="이메일 입력"><br><br> <!-- id="email"을 이용해 JavaScript에서 이메일 입력값을 가져옴 -->

<!-- 버튼을 클릭하면 checkJoin() 함수를 실행 -->
<button onclick="checkJoin()">가입 정보 확인</button> <!-- onclick은 마우스로 버튼을 클릭했을 때 실행할 명령을 지정 -->

<h3>검사 결과</h3> <!-- 검사 결과 영역의 제목 -->
<p id="result"></p> <!-- JavaScript가 검사 결과를 출력할 위치 -->

<script> <!-- JavaScript 코드를 작성하기 시작 -->

function checkJoin() { // checkJoin이라는 함수를 정의: 회원가입 정보를 검사하는 역할

    // 1. 입력한 이름과 이메일 가져오기
    var name = document.getElementById("name").value; // id가 name인 입력창을 찾아 사용자가 입력한 값을 가져와 name 변수에 저장
    var email = document.getElementById("email").value; // id가 email인 입력창의 입력값을 가져와 email 변수에 저장

    // 2. trim() : 앞뒤 공백 제거
    name = name.trim(); // 이름 문자열의 앞쪽과 뒤쪽에 있는 공백을 제거하고 다시 name에 저장
    email = email.trim(); // 이메일 문자열의 앞쪽과 뒤쪽에 있는 공백을 제거하고 다시 email에 저장

    // 3. toLowerCase() : 이메일을 소문자로 변환
    email = email.toLowerCase(); // 이메일에 포함된 영문 대문자를 모두 소문자로 바꿈

    // 4. length : 이름의 글자 수 확인
    var nameLength = name.length; // name 문자열의 길이를 계산하여 nameLength 변수에 저장

    // 5. indexOf() : 이메일에 @가 있는 위치 확인
    var atPosition = email.indexOf("@"); // 이메일에서 @가 처음 나타나는 위치를 찾음: 첫 글자의 위치는 0, 찾지 못하면 -1

    // 6. includes() : 이메일에 .이 포함되어 있는지 확인
    var hasDot = email.includes("."); // 이메일에 마침표(.)가 있으면 true, 없으면 false를 저장

    // 7. 검사 결과를 저장할 변수
    var message = ""; // 검사 결과를 저장할 빈 문자열 변수를 만듦

    // 8. 이름이 입력되었는지 확인
    if (nameLength == 0) { // 이름의 글자 수가 0이라면, 즉 아무것도 입력하지 않았다면
        message = "이름을 입력하세요."; // message 변수에 안내 문구를 저장
    } // 첫 번째 조건문 끝

    // 9. 이름이 2글자 이상인지 확인
    else if (nameLength < 2) { // 앞의 조건이 거짓이고 이름의 길이가 2보다 작다면
        message = "이름은 2글자 이상 입력하세요."; // 이름을 두 글자 이상 입력하도록 안내
    } // 두 번째 조건문 끝

    // 10. 이메일에 @가 있는지 확인
    else if (atPosition == -1) { // @의 위치가 -1이면 이메일에서 @를 찾지 못했다는 의미
        message = "이메일에 @를 입력하세요."; // @를 입력하도록 안내
    } // 세 번째 조건문 끝

    // 11. 이메일에 .이 있는지 확인
    else if (hasDot == false) { // hasDot이 false이면 이메일에 마침표가 없다는 의미
        message = "이메일에 .을 입력하세요."; // 마침표를 입력하도록 안내
    } // 네 번째 조건문 끝

    // 12. 모든 간단한 검사 통과
    else { // 위의 모든 조건이 거짓이라면 실행
        message = "가입 정보 확인 완료!\n"; // 검사 통과 메시지를 저장하고 \n으로 줄바꿈
        message += "이름 : " + name + "\n"; // 기존 message 뒤에 이름과 입력한 이름을 연결하고 줄바꿈
        message += "이메일 : " + email; // 기존 message 뒤에 이메일과 입력한 이메일을 연결
    } // 조건문 전체 끝

    // 13. 검사 결과 화면에 출력
    document.getElementById("result").innerText = message; // id가 result인 요소를 찾아 message 내용을 일반 텍스트로 출력
} // checkJoin() 함수 끝
</script> <!-- JavaScript 코드 작성 영역 끝 -->

<h2>텍스트 검색 및 변경 시스템</h2> <!-- 텍스트 검색 및 변경 프로그램의 제목 -->

<h3>검색할 문장</h3> <!-- 검색 대상 문장을 입력하는 영역의 제목 -->

<!-- 검색 대상 문장을 입력하거나 수정할 수 있는 여러 줄 입력창 -->
<textarea id="content" rows="5" cols="50">AI는 인공지능입니다. AI는 데이터를 학습하고 AI는 다양한 문제를 해결합니다.</textarea> <!-- rows는 입력창의 행 수, cols는 입력창의 너비를 지정 -->

<h3>검색할 단어</h3> <!-- 찾을 단어를 입력하는 영역의 제목 -->

<input type="text" id="keyword" placeholder="찾을 단어 입력"> <!-- 검색할 단어를 입력받는 한 줄 입력창 -->

<h3>변경할 단어</h3> <!-- 기존 단어를 어떤 단어로 변경할지 입력하는 영역의 제목 -->

<input type="text" id="newWord" placeholder="변경할 단어 입력"> <!-- 변경할 새로운 단어를 입력받는 한 줄 입력창 -->

<br><br> <!-- 화면에서 두 줄을 띄워 버튼과 입력창 사이에 간격을 만듦 -->

<button onclick="searchText()">검색하기</button> <!-- 클릭하면 검색 기능을 담당하는 searchText() 함수 실행 -->
<button onclick="replaceText()">단어 바꾸기</button> <!-- 클릭하면 단어 변경 기능을 담당하는 replaceText() 함수 실행 -->

<h3>검색 결과</h3> <!-- 검색 결과를 표시하는 영역의 제목 -->
<p id="result"></p> <!-- 검색 위치와 검색 횟수 등의 결과를 출력할 영역 -->

<h3>변경된 문장</h3> <!-- 변경된 문장을 표시하는 영역의 제목 -->
<p id="changed"></p> <!-- 변경이 완료된 문장을 출력할 영역 -->

<script> <!-- 텍스트 검색과 변경 기능을 위한 JavaScript 시작 -->

function searchText() { // searchText라는 함수를 정의: 사용자가 입력한 단어를 문장에서 검색

    // 1. 문장과 검색어 가져오기
    var content = document.getElementById("content").value; // id가 content인 입력창에서 검색 대상 문장을 가져옴
    var keyword = document.getElementById("keyword").value; // id가 keyword인 입력창에서 검색할 단어를 가져옴

    // 2. trim() : 검색어의 앞뒤 공백 제거
    keyword = keyword.trim(); // 검색어 앞뒤에 불필요하게 입력된 공백을 제거

    // 3. toLowerCase() : 대문자와 소문자를 구분하지 않도록 변환
    var text = content.toLowerCase(); // 검색 대상 문장 전체를 소문자로 변환하여 text 변수에 저장
    var word = keyword.toLowerCase(); // 검색할 단어도 소문자로 변환하여 word 변수에 저장

    // 4. 검색어가 입력되었는지 확인
    if (word.length == 0) { // 검색어의 길이가 0이면 아무것도 입력하지 않았다는 의미
        document.getElementById("result").innerText = "검색어를 입력하세요."; // 검색 결과 영역에 입력 안내 메시지를 출력
        return; // 함수를 즉시 종료하여 아래 검색 명령을 실행하지 않음
    } // 검색어 입력 여부 확인 끝

    // 5. includes() : 문장에 검색어가 포함되어 있는지 확인
    var found = text.includes(word); // 문장에 검색어가 포함되어 있으면 true, 없으면 false를 저장

    // 6. indexOf() : 검색어가 처음 나타나는 위치 확인
    var position = text.indexOf(word); // 검색어가 처음 등장하는 위치를 숫자로 저장: 첫 글자의 위치는 0, 없으면 -1

    // 7. split() : 검색어가 나타난 횟수 계산
    var count = text.split(word).length - 1; // 검색어를 기준으로 문장을 나누고, 나뉜 조각의 개수에서 1을 빼 검색 횟수를 계산

    // 8. 검색 결과 출력
    if (found == true) { // found가 true이면 문장에서 검색어를 찾았다는 의미
        document.getElementById("result").innerText = // 검색 결과 영역에 아래 문자열을 출력하도록 지정
            "검색어 : " + keyword + "\n" + // 검색한 단어를 출력하고 \n으로 다음 줄로 이동
            "검색 위치 : " + position + "\n" + // 검색어가 처음 발견된 위치를 출력하고 줄바꿈
            "검색 횟수 : " + count + "회"; // 검색어가 나타난 횟수를 출력
    } // 검색에 성공했을 때 실행하는 영역 끝
    else { // 검색어를 찾지 못했다면 실행
        document.getElementById("result").innerText = // 검색 결과 영역에 아래 안내 문구를 출력
            "검색어를 찾을 수 없습니다."; // 검색 실패 메시지
    } // 검색 성공과 실패를 구분하는 조건문 끝
} // searchText() 함수 끝

function replaceText() { // replaceText라는 함수를 정의: 사용자가 입력한 단어를 새로운 단어로 변경

    // 1. 원본 문장 가져오기
    var content = document.getElementById("content").value; // 검색 대상 입력창에서 현재 문장을 가져와 content 변수에 저장

    // 2. 사용자가 입력한 검색어 가져오기
    var keyword = document.getElementById("keyword").value; // 사용자가 찾으려는 기존 단어를 가져옴

    // 3. 사용자가 입력한 변경할 단어 가져오기
    var newWord = document.getElementById("newWord").value; // 사용자가 새롭게 바꾸려는 단어를 가져옴

    // 4. trim() : 앞뒤 공백 제거
    keyword = keyword.trim(); // 기존 검색어의 앞뒤 공백을 제거
    newWord = newWord.trim(); // 변경할 단어의 앞뒤 공백을 제거

    // 5. 검색어 입력 여부 확인
    if (keyword.length == 0) { // 기존 단어를 입력하지 않았다면 실행
        document.getElementById("changed").innerText = "찾을 단어를 입력하세요."; // 변경 결과 영역에 검색어 입력 안내 메시지를 출력
        return; // 검색어가 없으므로 함수를 종료
    } // 검색어 확인 조건문 끝

    // 6. 변경할 단어 입력 여부 확인
    if (newWord.length == 0) { // 새로운 단어를 입력하지 않았다면 실행
        document.getElementById("changed").innerText = "변경할 단어를 입력하세요."; // 변경할 단어를 입력하도록 안내
        return; // 변경할 단어가 없으므로 함수를 종료
    } // 변경할 단어 확인 조건문 끝

    // 7. includes() : 원본 문장에 검색어가 있는지 확인
    if (content.includes(keyword) == false) { // 원본 문장에 기존 검색어가 포함되어 있지 않으면 실행
        document.getElementById("changed").innerText = "변경할 단어를 찾을 수 없습니다."; // 검색어를 찾을 수 없다는 메시지를 출력
        return; // 변경할 대상이 없으므로 함수를 종료
    } // 기존 검색어 존재 여부 확인 끝

    // 8. replaceAll() : 검색어가 나타나는 모든 부분을 사용자가 입력한 단어로 변경
    var changedText = content.replaceAll(keyword, newWord); // content에서 keyword와 일치하는 모든 문자열을 newWord로 변경하여 저장

    // 9. 변경된 문장 출력
    document.getElementById("changed").innerText = changedText; // 변경된 문장을 id가 changed인 영역에 출력

    // 10. 변경된 문장을 입력창에도 반영
    document.getElementById("content").value = changedText; // 변경된 문장을 원래 입력창에도 넣어 화면에서 확인할 수 있도록 함
} // replaceText() 함수 끝

</script> <!-- 텍스트 검색과 변경을 위한 JavaScript 코드 끝 -->

<h3>검색 결과</h3> <!-- 검색 결과를 표시하는 제목 -->
<p id="result"></p> <!-- 검색 결과를 출력하는 문단: 앞에서 선언한 result와 같은 id를 사용 -->

<h3>변경된 문장</h3> <!-- 변경된 문장을 표시하는 제목 -->
<p id="changed"></p> <!-- 변경 결과를 출력하는 문단: 앞에서 선언한 changed와 같은 id를 사용 -->

<h2>학생 성적 데이터 분석</h2> <!-- 학생의 성적을 분석하는 프로그램의 제목 -->

<p>학생 이름과 점수를 쉼표로 구분하여 입력하세요.</p> <!-- 데이터 입력 방법을 사용자에게 설명 -->

<!-- 여러 학생의 이름과 점수를 여러 줄로 입력할 수 있는 입력창 -->
<textarea id="data" rows="7" cols="40">홍길동,80
김철수,90
이영희,85
박민수,95</textarea> <!-- 한 줄에 학생 한 명의 이름과 점수를 쉼표로 구분하여 입력 -->

<br><br> <!-- 입력창과 버튼 사이에 두 줄의 간격을 만듦 -->

<button onclick="analyze()">데이터 분석</button> <!-- 클릭하면 학생 데이터를 분석하는 analyze() 함수 실행 -->

<script> <!-- 학생 성적 데이터 분석을 위한 JavaScript 시작 -->

function analyze() { // analyze라는 함수를 정의: 입력된 학생 이름과 점수를 분석

    // 1. 입력된 전체 데이터 가져오기
    var data = document.getElementById("data").value; // id가 data인 입력창에서 전체 학생 데이터를 가져옴

    // 2. split("\n") : 줄바꿈을 기준으로 학생 데이터 분리
    var rows = data.split("\n"); // 줄바꿈 문자 \n을 기준으로 데이터를 나누어 배열 rows에 저장

    // 3. 데이터 개수 확인
    var count = rows.length; // rows 배열에 들어 있는 데이터의 개수를 계산하여 count에 저장

    // 4. 점수 합계를 저장할 변수
    var total = 0; // 모든 학생의 점수를 더할 변수이며 처음에는 0으로 설정

    // 5. 학생별 분석 결과를 저장할 문자열
    var output = ""; // 분석 결과를 화면에 출력하기 위해 빈 문자열로 시작

    // 6. 각 학생의 데이터를 반복해서 처리
    for (var i = 0; i < rows.length; i++) { // i를 0부터 시작하여 마지막 학생 데이터까지 하나씩 반복

        // 7. split(",") : 쉼표를 기준으로 이름과 점수 분리
        var student = rows[i].split(","); // 현재 줄의 데이터를 쉼표 기준으로 나누어 배열 student에 저장

        // 8. trim() : 이름과 점수의 앞뒤 공백 제거
        var name = student[0].trim(); // 배열의 첫 번째 값인 학생 이름을 가져오고 앞뒤 공백을 제거

        // 9. 점수가 입력되지 않았거나 형식이 잘못된 경우 건너뛰기
        if (student.length < 2 || student[1].trim() == "") { // 쉼표로 나눈 데이터가 2개 미만이거나 점수 부분이 비어 있다면
            continue; // 현재 학생 데이터의 나머지 처리를 중단하고 다음 학생 데이터로 이동
        } // 점수 입력 여부 확인 끝

        // 10. Number() : 문자열 점수를 숫자로 변환
        var score = Number(student[1].trim()); // 두 번째 값인 점수 문자열을 실제 숫자로 변환하여 score에 저장

        // 11. 이름과 점수의 유효성 확인
        if (name == "" || isNaN(score) || score < 0 || score > 100) { // 이름이 비었거나 숫자가 아니거나 점수가 0보다 작거나 100보다 크면
            continue; // 잘못된 데이터이므로 현재 학생을 건너뛰고 다음 학생을 처리
        } // 데이터 유효성 검사 끝

        // 12. 점수를 합계에 더하기
        total = total + score; // 기존 total에 현재 학생의 점수를 더하여 다시 total에 저장

        // 13. 학생 이름과 점수 출력 내용 만들기
        output += name + " : " + score + "점<br>"; // 학생 이름과 점수를 문자열로 연결하고 <br>을 추가하여 줄바꿈 형태로 저장
    } // for 반복문 끝: 모든 학생 데이터를 처리

    // 14. 유효한 데이터가 있는지 확인
    var validCount = output == "" ? 0 : output.split("<br>").length - 1; // output이 비어 있으면 0명, 내용이 있으면 줄바꿈 기준으로 학생 수 계산

    if (validCount == 0) { // 유효하게 처리된 학생이 한 명도 없다면
        document.getElementById("result").innerHTML = "분석할 수 있는 데이터가 없습니다."; // 결과 영역에 분석할 데이터가 없다는 메시지를 HTML로 출력
        return; // 분석할 데이터가 없으므로 함수를 종료
    } // 유효한 데이터 확인 끝

    // 15. 평균 계산
    var average = total / validCount; // 전체 점수 합계를 유효한 학생 수로 나누어 평균 점수 계산

    // 16. 최종 결과 출력
    document.getElementById("result").innerHTML = // id가 result인 영역에 HTML 형식으로 분석 결과를 출력
        "<h4>학생별 점수</h4>" + // 네 번째 크기의 제목을 출력
        output + // 앞에서 만든 학생별 이름과 점수 목록을 출력
        "<hr>" + // 가로 구분선을 출력하여 학생별 점수와 통계 결과를 구분
        "학생 수 : " + validCount + "명<br>" + // 유효하게 분석된 학생 수를 출력하고 줄바꿈
        "점수 합계 : " + total + "점<br>" + // 전체 점수의 합계를 출력하고 줄바꿈
        "평균 점수 : " + average.toFixed(2) + "점"; // 평균을 소수점 둘째 자리까지 표시하고 점수 단위를 붙임

} // analyze() 함수 끝

</script> <!-- 학생 성적 분석 JavaScript 코드 끝 -->

<h3>분석 결과</h3> <!-- 분석 결과를 표시하는 제목 -->
<div id="result"></div> <!-- JavaScript가 최종 분석 결과를 출력할 영역 -->

</body> <!-- 화면에 표시할 본문 영역 끝 -->
</html> <!-- HTML 문서 끝 -->
